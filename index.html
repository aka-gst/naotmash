<head>

<!-- Единственная внешняя загрузка на странице. Счётчик отложенный: не
     загрузится — игра работает как обычно. -->

<title>Наотмашь — проба физики</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #0d1014; color: #e8eef5;
    font: 13px/1.35 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  #hud {
    position: absolute; left: 10px; top: 10px; pointer-events: none;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000;
  }
  #hud b { font-weight: 600; color: #fff; }
  #hud .dim { color: #7c8b9c; }
  #gauges { display: none; }
  #gauges.on { display: block; }
  #speedbar { width: 132px; height: 5px; margin: 5px 0 7px; border-radius: 3px; background: #1e2833; overflow: hidden; }
  #speedfill { height: 100%; width: 0; background: #35506b; transition: background .12s; }

  #panel {
    position: absolute; left: 8px; right: 8px;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  .grp {
    display: flex; align-items: center; gap: 2px;
    background: #161c24cc; border: 1px solid #263140; border-radius: 9px; padding: 3px 4px;
    backdrop-filter: blur(6px);
  }
  .grp span { padding: 0 5px; color: #9fb0c2; font-size: 12px; }
  .grp span i { font-style: normal; color: #fff; font-weight: 600; }
  button {
    font: inherit; color: #dbe6f2; background: #222c38; border: 0; border-radius: 6px;
    min-width: 26px; height: 26px; padding: 0 8px; cursor: pointer; touch-action: manipulation;
  }
  button:active { background: #33506e; }
  button.on { background: #2f6b4a; color: #eaffef; }

  .modal {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; gap: 9px;
    /* сверху оставлено место под кнопки сайта, иначе они лягут на заголовок */
    padding: calc(64px + env(safe-area-inset-top, 0px)) 18px 18px;
    /* Содержимое выше экрана при justify-content:center обрезается сверху, и
       заголовок становится недостижим. flex-start — запасной путь для старых
       браузеров, safe center центрует, только когда всё помещается. */
    justify-content: flex-start;
    justify-content: safe center;
    background: #0d1014e6; backdrop-filter: blur(3px); z-index: 5;
  }
  .modal.on { display: flex; }
  .modal { overflow-y: auto; }
  .modal h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; color: #9fb0c2; }
  .modal button {
    display: flex; flex-direction: row; align-items: center; gap: 12px;
    width: min(340px, 90%); height: auto; padding: 11px 14px; text-align: left;
    background: #1a232e; border: 1px solid #2c3a4a; border-radius: 11px;
  }
  .modal .ic { flex: 0 0 26px; color: #8fb0c9; }
  .modal .ic svg { display: block; width: 26px; height: 26px; }
  .modal .tx { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  #gear svg { display: block; width: 15px; height: 15px; margin: 0 auto; }
  #panel .ic svg { display: block; width: 14px; height: 14px; }
  .modal button:active { background: #29455f; }
  .modal b { font-size: 15px; color: #fff; }
  .modal span { font-size: 12.5px; color: #93a5b8; line-height: 1.4; }

  #start h1 { margin: 0 0 2px; font-size: 24px; font-weight: 600; letter-spacing: .02em; }
  #start .lead { margin: 0 0 12px; max-width: 340px; font-size: 15px; line-height: 1.5; color: #dfe9f4; }
  #start .lead span { display: inline-block; margin-top: 3px; font-size: 13px; color: #93a5b8; }
  /* Карточка оружия — это кнопка «начать», и выглядеть она обязана кнопкой:
     иначе человек стоит на пороге и ищет, где тут старт. */
  #start .pick { position: relative; background: #1e2b3a; border-color: #46617e;
                 box-shadow: 0 1px 0 #0b1119, inset 0 1px 0 #ffffff0f; }
  #start .pick .arw { margin-left: auto; padding-left: 6px; font-size: 20px; line-height: 1; color: #7fd8a4; }
  #start .pick:hover, #start .pick:focus-visible { background: #26374a; border-color: #7fd8a4; }
  #start .pick:active { background: #2f6b4a; border-color: #3d8a60; }
  #start details { margin: 14px 0 0; max-width: 340px; }
  #start summary { cursor: pointer; color: #7fa3c4; font-size: 13.5px; padding: 6px 0; }
  #start ul { margin: 4px 0 14px; padding: 0 0 0 18px; max-width: 340px; color: #9fb0c2; font-size: 13.5px; line-height: 1.7; }
  #start ul b { font-size: inherit; }
  #start .rec, #over .rec { margin: 0 0 10px; color: #cfae55; font-size: 13.5px; }
  #over ul { margin: 2px 0 14px; padding: 0 0 0 18px; max-width: 340px; color: #9fb0c2; font-size: 14px; line-height: 1.8; }
  #over ul b { font-size: inherit; color: #fff; }
  #over h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  #go { align-items: center !important; font-size: 16px; font-weight: 600; color: #eafff0;
        background: #2f6b4a; border-color: #3d8a60; padding: 13px !important; }

  .game-home-menu {
    position: fixed; z-index: 1000; display: block;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    padding: 10px 12px; border: 1px solid #76ff9f; background: #0b1010f2; color: #f7f1ff;
    font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em;
    text-align: center; text-decoration: none; white-space: nowrap;
    box-shadow: 0 0 14px #76ff9f20;
  }
  .game-home-menu:hover, .game-home-menu:focus-visible {
    background: #153725; color: #fff; outline: 2px solid #bc70ff; outline-offset: 3px;
  }

  #panel.off { display: none; }
  #gear {
    position: absolute; right: 10px; z-index: 6;
    top: calc(56px + max(10px, env(safe-area-inset-top)));   /* под кнопкой сайта */
    width: 34px; height: 34px; padding: 0; font-size: 15px; line-height: 34px;
    background: #161c24cc; border: 1px solid #263140; border-radius: 9px;
  }

</style>
</head>
<body>
<canvas id="c"></canvas>

<a class="game-home-menu" href="/" aria-label="Вернуться на главную aka-gst.ru">⌂ НА ГЛАВНУЮ</a>

<div id="hud">
  <div><span class="dim">волна</span> <b id="wv">1</b> <span class="dim" id="th"></span> <span class="dim">· счёт</span> <b id="sc">0</b></div>
  <div id="gauges">
    <div><span class="dim">оружие</span> <b id="sp">0</b> <span class="dim">px/с</span></div>
    <div id="speedbar"><div id="speedfill"></div></div>
    <div><span class="dim">макс. по телу</span> <b id="mx">0</b></div>
    <div><span class="dim">длина оружия</span> <b id="ln">7</b></div>
    <div><span class="dim">лучший удар</span> <b id="best">0</b></div>
  </div>
</div>

<div id="cards" class="modal"></div>

<div id="start" class="modal"></div>

<div id="over" class="modal"></div>

<button id="gear" aria-label="настройки"></button>

<!-- Скрыт разметкой, а не скриптом: если скрипт упадёт, наши внутренности
     не должны оказаться на экране вместо игры. -->
<div id="panel" class="off">
  <div class="grp"><span>длина <i id="v-len">7</i></span><button data-a="len-">−</button><button data-a="len+">+</button></div>
  <div class="grp"><span>вес кончика <i id="v-tip">30</i>%</span><button data-a="tip-">−</button><button data-a="tip+">+</button></div>
  <div class="grp"><span>упругость <i id="v-bend">5</i></span><button data-a="bend-">−</button><button data-a="bend+">+</button></div>
  <div class="grp"><span>инерция руки <i id="v-hand">5</i></span><button data-a="hand-">−</button><button data-a="hand+">+</button></div>
  <div class="grp"><span>рывок <i id="v-spd">900</i></span><button data-a="spd-">−</button><button data-a="spd+">+</button></div>
  <div class="grp"><button data-a="sound" class="on"><span class="ic" id="snd"></span></button><button data-a="rock" class="on">камень</button><button data-a="foes" class="on">враги</button><button data-a="reset">сброс</button></div>
</div>

<script type="module">
/**
 * «Кольчатый» — проба одной идеи: тело червя это верёвка, а верёвка это кистень.
 * Кнопки атаки нет. Есть только палец, инерция и скорость звена в момент касания.
 *
 * Здесь нет прогрессии, волн и баланса — только ощущение замаха.
 */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

/* ─────────────────────────────── Настройки ─────────────────────────────── */

const S = {
    len: 7,           // сегментов: начинаем коротким и отращиваем
    len0: 7,          // с чего начали: потолок роста считается от него
    seg: 11,          // длина звена, единиц мира
    headSpeed: 900,   // максимальная скорость головы, px/с
    tipWeight: 0.30,  // насколько тяжёлый кончик тянет за собой тело
    drag: 0.992,      // сопротивление среды за подшаг
    hand: 5,          // инерция руки: 1 — рывком, 9 — вязко
    reach: 76,        // длина руки: у меча короткая, у цепа длинная
    stiff: 1,         // мягкая цепь копит энергию как пружина и щёлкает сильнее
    bend: 5,          // упругость на излом: 0 — цепь, 9 — почти прут
    bladeW: 13,       // толщина боевой части
    bladeRGB: [150, 190, 215],
    rigid: false,     // жёсткое оружие не болтается, а продолжает руку
    thrust: false,    // жёсткое: колоть вдоль древка, а не рубить поперёк
    sprite: 'flail',  // какой спрайт боевой части брать
    haft: '#8b9198', haftDark: '#3b4046',
    sound: true,
    mode: 'head',     // 'head' — палец держит голову; 'tip' — палец держит оружие
    bodyMul: 1,       // множитель урона обычных звеньев
    bladeMul: 2.2,    // множитель урона наконечника
    rock: true,
    foes: true,
};

/** То, к чему возвращаемся между забегами: настройки руками — да, прокачка — нет. */
const BASE = { ...S };

const DT = 1 / 120;          // фиксированный шаг физики
const HIT_SPEED = 260;       // ниже этого касание безвредно
const BLADE = 3;             // сколько последних звеньев считаются «оружием»
const DMG_K = 0.43;          // урон растёт по корню скорости, а не линейно
const TEAR = 80;             // выше этого удар по голове отрывает её напрочь
const ROCK_MAX = 1100;       // потолок скорости камня, единиц мира в секунду
const PAD = 6;
// Слева стена, за ней замок, в стене ворота. Игра больше не «отбивайся на
// пустой арене»: у неё есть место, которое нельзя отдать. Отсюда выбор,
// которого раньше не было — стоять у ворот или уйти чистить тех, кто лезет
// через стену выше и ниже.
const WALL = 34;             // толщина стены, единиц мира
const GATE_H = 150;          // высота проёма ворот
const CLIMB = 4.2;           // сколько секунд враг лезет через стену
const gate = { hp: 100, hp0: 100, hit: 0, over: 0 };
const gateTop = () => H / 2 - GATE_H / 2;
const gateBot = () => H / 2 + GATE_H / 2;
/**
 * Куда идёт враг. Треть лезет через стену выше или ниже ворот — иначе стоять
 * у проёма выгодно всегда, и «иногда отходить» не случается никогда: замер
 * показал, что стерегущий ворота бот держит их в 8 партиях из 8, ни разу не
 * отойдя. Выбор появляется только тогда, когда есть кого пропустить.
 */
function pickWallSpot() {
    if (Math.random() < 0.64) return H / 2;
    const above = Math.random() < 0.5;
    return above ? rnd(40, gateTop() - 20) : rnd(gateBot() + 20, H - 40);
}
const gateAim = (e) => ({ x: WALL + 16, y: e && e.wallY !== undefined ? e.wallY : H / 2 });
/**
 * Короткая сторона экрана — это всегда 450 единиц мира. Иначе на узком
 * телефоне те же 900 ед/с означают вдвое более быстрый полёт по арене,
 * чем на десктопе, и управление становится дёрганым именно там.
 */
const VIEW = 450;
/**
 * Биом — это палитра плюс один приём в отрисовке. Меняется каждые пять
 * волн, то есть ровно с приходом очередной туши.
 */
const BIOMES = [
    { name: 'Двор',   tile: 'yard', sky: '#12160f', line: '#1b2317', spot: '#26301f', mark: '#33402a', style: 'камни' },
    { name: 'Лёд',    tile: 'ice',  sky: '#0c131a', line: '#142029', spot: '#1d2f3b', mark: '#2b4d61', style: 'трещины' },
    { name: 'Чертог', tile: 'hall', sky: '#15100c', line: '#221913', spot: '#2c2019', mark: '#4a3220', style: 'плиты' },
    { name: 'Пепел',  tile: 'ash',  sky: '#121110', line: '#1c1a19', spot: '#262321', mark: '#3b332c', style: 'пепел' },
];

/**
 * Спрайты и текстуры лежат рядом файлами и грузятся лениво, как звук: первый
 * экран не должен ждать полутора сотен килобайт картинок. Всё рисование идёт
 * через ready(), поэтому не доехавший спрайт просто не рисуется — кадр от
 * этого не ломается. Файлы свои, того же адреса: игра по-прежнему никуда
 * наружу не ходит.
 */
const SPR_NAMES = [
    'obstacle-pillar-broken', 'obstacle-pillar', 'obstacle-crate-broken', 'obstacle-crate',
    'obstacle-barrel-broken', 'obstacle-barrel', 'item-chest-closed', 'item-rune', 'prop-rock',
    'pickup-soul', 'hero-body', 'hero-head', 'hero-hand', 'foe-shield-shield',
    'boss-hulk-plates', 'boss-worm-head', 'boss-worm-link', 'boss-worm-tail', 'foe-walker-head',
    'foe-walker-torso', 'foe-walker-legs', 'foe-runner-head', 'foe-runner-torso',
    'foe-runner-legs', 'foe-fat-head', 'foe-fat-torso', 'foe-fat-legs', 'foe-shield-head',
    'foe-shield-torso', 'foe-shield-legs', 'boss-hulk-head', 'boss-hulk-torso',
    'boss-hulk-legs', 'foe-crawler-head', 'foe-crawler-torso', 'foe-crawler-legs',
    'foe-jumper-head', 'foe-jumper-torso', 'foe-jumper-legs', 'foe-brute-head',
    'foe-brute-torso', 'foe-brute-legs', 'foe-spike-head', 'foe-spike-torso', 'foe-spike-legs',
    'foe-husk-head', 'foe-husk-torso', 'foe-husk-legs', 'weapon-flail-link',
    'weapon-flail-head', 'weapon-axe-haft', 'weapon-axe-blade', 'weapon-sword-haft',
    'weapon-sword-blade', 'weapon-spear-haft', 'weapon-spear-blade', 'weapon-halberd-haft',
    'weapon-halberd-blade', 'weapon-club-haft', 'weapon-club-blade', 'weapon-pick-haft',
    'weapon-pick-blade', 'weapon-mace-link', 'weapon-mace-head', 'weapon-sickle-link',
    'weapon-sickle-head', 'weapon-hook-link', 'weapon-hook-head', 'weapon-hammer-link',
    'weapon-hammer-head',
];

const SPR = {};
for (const k of SPR_NAMES) {
    const im = new Image();
    im.src = 'sprites/' + k + '.svg';
    SPR[k] = im;
}
const ready = (im) => im && im.complete && im.naturalWidth > 0;

const ICON = {
    'armor': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M4 3L12 1L20 3L19 15L12 23L5 15Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'axe': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><g fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 20L17 6M13 4Q20 3 22 9Q18 13 12 11Z\"/></g></svg>",
    'back': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M3 12L12 3V8H21V16H12V21Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'boom': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M12 1L15 7L22 4L18 11L23 15L16 16L17 23L11 18L6 23L7 16L1 14L6 10L2 4L9 7Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'chain': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M3 8Q3 3 8 3H12V7H8Q7 7 7 8T8 9H12V13H8Q3 13 3 8ZM12 11H16Q21 11 21 16T16 21H12V17H16Q17 17 17 16T16 15H12Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'club': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M8 22L5 19L14 10Q11 4 16 2Q22 5 18 10Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'crit': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M12 1L15 8L23 9L17 14L19 22L12 18L5 22L7 14L1 9L9 8Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'dash': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><g fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7H14M3 12H19M3 17H14\"/></g></svg>",
    'flail': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><g fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20L10 14M11 13L15 9M17 7L20 4\"/><circle cx=\"20\" cy=\"4\" r=\"3\"/></g></svg>",
    'gear': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><g fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2L14 5 18 4 19 8 22 10 20 14 21 18 17 19 14 22 11 20 7 21 5 17 2 14 4 10 3 6 7 5 9 2Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"none\"/></g></svg>",
    'halberd': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M11 23V9L3 7L10 3L9 1L15 5L22 2L18 9L14 10V23Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'hammer': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M3 4H17L22 9L17 14H14V23H9V14H3Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",
    'heal': "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\"><path d=\"M9 1H15V9H23V15H15V23H9V15H1V9H9Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/></svg>",

/** Земля — четыре плитки 512×512, половина прежнего веса документа. */
const GROUND = ['yard', 'ice', 'hall', 'ash'];

const groundTile = {};
for (const k of GROUND) {
    const im = new Image();
    im.src = 'field/field-' + k + '.png';
    groundTile[k] = im;
}

/**
 * На сколько рука отходит от тела. Дальше — герой идёт за оружием.
 * Это свойство оружия, а не героя: меч должен сидеть у тела, цеп — висеть
 * далеко. Общая константа делала любой клинок «на длинной палке».
 */
const REACH = 76;
const HERO_SPEED = 165;   // единиц мира в секунду, шагом
const HERO_R = 11;
/** Насколько быстро скорость руки догоняет желаемую, за подшаг. */
const EASE = [0.45, 0.30, 0.20, 0.13, 0.085, 0.055, 0.035, 0.022, 0.014];

/* ──────────────────────────────── Состояние ────────────────────────────── */

let pts = [], foes = [], orbs = [], nums = [], trail = [], bits = [];
let sc = 1;   // сколько пикселей экрана в одной единице мира
let deco = [], decoFor = -1;      // неподвижное убранство арены
let dec = null, decCtx = null;    // слой следов: он не перерисовывается
let rock = null;
let aim = { x: 0, y: 0, down: false };
let best = 0, spawnTimer = 0, shake = 0, dead = 0, gateLost = false;
let hero = null, held = null, tense = false, slow = 0;
let started = false, menu = false;
let score = 0, kills = 0, record = 0;
let hooked = null, thrown = 0, grabs = 0;
let gripped = null, gripT = 0;   // щитоносец, вцепившийся в оружие
let cntOver = 0, cntGrip = 0, cntBoom = 0, cntEpic = 0, cntFade = 0, cntIn = 0;   // сколько раз сработали повадки
let inCorner = 0, bodySamples = 0;   // сколько времени тела проводят по углам
let trial = null, trials = 0;   // испытание: пока отложено, живёт под ?trial
let boons = [], taken = 0;   // усиления и оружие, падающие прямо в бою
let barrels = [], blown = 0;   // бочки: бьются от удара и от брошенного тела
const METER = 20;   // единиц мира в метре: викинг ростом чуть больше метра
let armX = 0, armY = 1;   // куда смотрит древко у жёсткого оружия   // как быстро едет петля
let theme = null, bossDone = false;
let marks = [];                     // где сейчас заходят враги
let biomeShown = -1, biomeWas = -1, biomeFade = 1;   // задник меняется переходом
let segNow = 11;   // рабочая длина звена: под напряжением цепь подбирается
let wave = 0, spawnLeft = 0, paused = false;

/**
 * Свой генератор — чтобы забег можно было повторить по номеру, если
 * когда-нибудь понадобится. Сид берётся случайный: каждый бой свой.
 */
let seed = 1;
const srand = (n) => { seed = (n >>> 0) || 1; };
const rnd = (a, b) => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return a + (seed / 4294967296) * (b - a);
};


function reset() {
    Object.assign(S, BASE);          // прокачка прошлого забега не переносится
    segNow = S.seg;
    buildDec(); buildDeco();
    hero = { x: W / 2, y: H / 2, hp: 5, hpMax: 5, iframe: 0, fx: 0, fy: 1 };
    held = null;
    pts = [];
    for (let i = 0; i < S.len; i++) {
        const y = H / 2 + 24 + i * S.seg;
        pts.push({ x: W / 2, y, px: W / 2, py: y });
    }
    foes = []; orbs = []; nums = []; trail = []; bits = []; boons = [];
    rock = { x: W / 2, y: H * 0.28, vx: 0, vy: 0, r: 19 };
    aim = { x: W / 2, y: H / 2, down: false };
    best = 0; shake = 0; dead = 0; wave = 0; score = 0; kills = 0; thrown = 0; grabs = 0;
    gateLost = false; gate.hp = gate.hp0; gate.hit = 0; gate.over = 0;
    marks = []; biomeShown = -1; biomeWas = -1; biomeFade = 1;
    trial = null; trials = 0; boons = []; taken = 0; barrels = []; blown = 0;
    gripped = null; hooked = null;
    cntOver = 0; cntGrip = 0; cntBoom = 0; cntEpic = 0; cntFade = 0; cntIn = 0; inCorner = 0; bodySamples = 0;
    srand(Math.floor(Math.random() * 2147483647));
    startWave();
}

/* ─────────────────────────────── Арена ─────────────────────────────────── */

const forcedBiome = (location.search.match(/biome=(\d+)/) || [])[1];
const biomeIdx = () => (forcedBiome !== undefined
    ? +forcedBiome % BIOMES.length                     // для проверки внешнего вида
    : Math.floor(Math.max(0, wave - 1) / 5) % BIOMES.length);
const biome = () => BIOMES[biomeIdx()];

/**
 * Убранство неподвижно, поэтому раскладывается один раз. Случайность здесь
 * своя, не игровая: расстановка камней не должна влиять на бой.
 */
function buildDeco() {
    decoFor = biomeIdx();
    deco = [];
    for (let i = 0; i < 54; i++) {
        deco.push({
            x: Math.random() * W, y: Math.random() * H,
            r: 2 + Math.random() * 8, a: Math.random() * 6.283,
            l: 12 + Math.random() * 52, t: Math.random(),
        });
    }
}

/** Слой следов: выбоины и пятна копятся за забег и не стираются. */
function buildDec() {
    if (!W || !H) return;
    dec = document.createElement('canvas');
    dec.width = Math.max(1, Math.ceil(W));
    dec.height = Math.max(1, Math.ceil(H));
    decCtx = dec.getContext('2d');
}

function stain(x, y, r, color, alpha) {
    if (!decCtx) return;
    decCtx.globalAlpha = alpha;
    decCtx.fillStyle = color;
    decCtx.beginPath();
    for (let i = 0; i < 5; i++) {
        decCtx.arc(x + (Math.random() - 0.5) * r * 1.6, y + (Math.random() - 0.5) * r * 1.6,
            r * (0.3 + Math.random() * 0.6), 0, 7);
    }
    decCtx.fill();
    decCtx.globalAlpha = 1;
}

/* ──────────────────────────────── Физика ───────────────────────────────── */

const driver = () => (S.mode === 'tip' ? pts.length - 1 : 0);
/** На сколько звеньев оружие переросло своё начальное состояние. */
const grown = () => Math.max(0, pts.length - S.len0);

function step(dt) {
    // Палец держит ровно одно звено. Всё остальное — следствие.
    const d0 = driver();
    const h = pts[d0];
    let vx = h.x - h.px, vy = h.y - h.py;
    let wx = 0, wy = 0;
    if (aim.down) {
        const dx = aim.x - h.x, dy = aim.y - h.y;
        const d = Math.hypot(dx, dy) || 1;
        const want = Math.min(d / dt, S.headSpeed) * dt;
        wx = dx / d * want; wy = dy / d * want;
    }
    // У руки есть вес: разгон и остановка занимают время. Без этого голова
    // мгновенно встаёт колом, и цепь передаёт этот рывок прямо в хлыст.
    // Напряжение подбирает цепь к руке — это и есть способ её укротить.
    // Меняем плавно: рывком это швырнуло бы весь хвост.
    const segWant = tense ? S.seg * 0.66 : S.seg;
    segNow += (segWant - segNow) * 0.016;

    const e = EASE[S.hand - 1];
    vx += (wx - vx) * e; vy += (wy - vy) * e;
    h.px = h.x; h.py = h.y;
    h.x += vx; h.y += vy;

    // Рука не отрывается от плеча. Уводишь дальше вытянутой руки — герой
    // шагает следом: одним пальцем и машешь, и ходишь.
    const ax = h.x - hero.x, ay = h.y - hero.y;
    const ad = Math.hypot(ax, ay);
    if (ad > S.reach) {
        const over = ad - S.reach, ux = ax / ad, uy = ay / ad;
        // Чем дальше уводят руку, тем быстрее герой бежит следом. Жёсткий упор
        // здесь недопустим: он ограничивает руку скоростью шага, и хлыст глохнет.
        const walk = Math.min(over, (HERO_SPEED + over * 4.5) * dt);
        hero.x += ux * walk; hero.y += uy * walk;
        hero.x = Math.max(WALL + HERO_R, Math.min(W - PAD - HERO_R, hero.x));
        hero.y = Math.max(PAD + HERO_R, Math.min(H - PAD - HERO_R, hero.y));
        h.x -= ux * over * 0.16; h.y -= uy * over * 0.16;   // рука тянется, а не упирается
    }
    if (ad > 1) { hero.fx = ax / ad; hero.fy = ay / ad; }

    // Жёсткое оружие не болтается: оно продолжает руку. Направление берём от
    // тела к кисти — то есть куда вытянул руку, туда и смотрит древко.
    if (S.rigid) {
        const dx = h.x - hero.x, dy = h.y - hero.y;
        const d = Math.hypot(dx, dy) || 1;
        armX += (dx / d - armX) * 0.25;
        armY += (dy / d - armY) * 0.25;
        const an = Math.hypot(armX, armY) || 1;
        armX /= an; armY /= an;
        for (let i = 1; i < pts.length; i++) {
            const p = pts[i];
            p.px = p.x; p.py = p.y;
            p.x = h.x + armX * i * segNow;
            p.y = h.y + armY * i * segNow;
        }
        for (const p of pts) bounce(p, 8);
        combat(dt);
        if (S.rock) moveRock(dt);
        if (S.foes) moveFoes(dt);
        return;
    }

    // Остальные звенья живут своей инерцией: именно отставание и даёт хлыст.
    // Чем длиннее оружие, тем гуще среда: иначе прокачка делает его диким.
    const air = Math.max(0.972, S.drag - grown() * 0.0027);
    for (let i = 0; i < pts.length; i++) {
        if (i === d0) continue;
        const p = pts[i];
        const vx = (p.x - p.px) * air, vy = (p.y - p.py) * air;
        p.px = p.x; p.py = p.y;
        p.x += vx; p.y += vy;
    }

    // Звенья нерастяжимы. Тянем от ведомого пальцем звена к обоим концам,
    // поэтому одна и та же цепь работает в обе стороны.
    for (let k = 0; k < 3; k++) {
        unbend();
        for (let i = d0 + 1; i < pts.length; i++) solve(pts[i - 1], pts[i], i, i - 1 === d0);
        for (let i = d0 - 1; i >= 0; i--) solve(pts[i + 1], pts[i], i + 1, i + 1 === d0);
    }

    for (const p of pts) bounce(p, 8);

    combat(dt);
    if (S.rock) moveRock(dt);
    if (S.foes) moveFoes(dt);
}

/**
 * Тело сопротивляется излому: каждый сустав тянется к середине между
 * соседями. Это и есть разница между цепью и хлыстом — свободная цепь
 * мотается непредсказуемо, а упругая ведёт себя читаемо.
 */
function unbend() {
    // Каждое лишнее звено усиливает разгон. Чтобы прокачка не превращала
    // оружие в неуправляемое, упругость растёт вместе с длиной.
    const k = (tense ? 9 : Math.min(9, S.bend + grown() * 2)) * 0.022;
    if (k <= 0) return;
    for (let i = 1; i < pts.length - 1; i++) {
        const a = pts[i - 1], b = pts[i], c = pts[i + 1];
        b.x += ((a.x + c.x) / 2 - b.x) * k;
        b.y += ((a.y + c.y) / 2 - b.y) * k;
    }
}

/**
 * `a` ведёт, `b` следует. Тяжёлый наконечник частично утаскивает ведущее
 * звено за собой — но никогда то, которое держит палец.
 */
function solve(a, b, i, lockA) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1e-6;
    const diff = (d - segNow) / d * S.stiff;
    const w = (!lockA && i >= pts.length - BLADE) ? (held ? Math.max(S.tipWeight, held.mass) : S.tipWeight) : 0;
    a.x += dx * diff * w;       a.y += dy * diff * w;
    b.x -= dx * diff * (1 - w); b.y -= dy * diff * (1 - w);
}

function bounce(p, r) {
    const vx = p.x - p.px, vy = p.y - p.py;
    let hit = false;
    if (p.x < WALL + r) { p.x = WALL + r; hit = true; }
    if (p.x > W - PAD - r) { p.x = W - PAD - r; hit = true; }
    if (hit) p.px = p.x + vx * 0.5;
    hit = false;
    if (p.y < PAD + r) { p.y = PAD + r; hit = true; }
    if (p.y > H - PAD - r) { p.y = H - PAD - r; hit = true; }
    if (hit) p.py = p.y + vy * 0.5;
}

const vel = (p) => [(p.x - p.px) / DT, (p.y - p.py) / DT];

/**
 * Скорость, по которой считается урон. У жёсткого оружия «своё» направление
 * идёт полностью, чужое со скидкой. Единственный источник правды: по этой же
 * величине светится лента замаха, поэтому она не врёт про то, пробьёшь ты
 * или нет.
 */
function effSpeed(vx, vy) {
    if (!S.rigid) return Math.hypot(vx, vy);
    const along = Math.abs(vx * armX + vy * armY);
    const perp = Math.abs(vx * -armY + vy * armX);
    return S.thrust ? along * 1.6 + perp * 0.3 : perp + along * 0.3;
}
const hitFloor = () => (S.rigid ? 150 : HIT_SPEED);
const radiusAt = (i) => (i >= pts.length - BLADE ? 9 : 6);

/**
 * На хорошем замахе звено проходит за подшаг больше сотни пикселей и
 * перепрыгивает врага целиком. Поэтому проверяем не точку, а весь путь звена.
 */
function swept(p, e, r) {
    const dx = p.x - p.px, dy = p.y - p.py;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((e.x - p.px) * dx + (e.y - p.py) * dy) / l2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return Math.hypot(e.x - (p.px + dx * t), e.y - (p.py + dy * t)) <= r + e.r;
}

/* ──────────────────────────────── Бой ──────────────────────────────────── */

function combat(dt) {
    for (const e of foes) {
        e.iframe -= dt;
        if (e.iframe > 0 || e === hooked) continue;   // за что держишься, то не бьёшь
        if (e.probe === undefined) { e.probe = 0; e.probeSp = 0; e.probeArm = 0; }
        let hitPart = -1, hitSeg = -1;
        for (let i = 1; i < pts.length && hitPart < 0; i++) {
            const r = radiusAt(i);
            for (let j = 0; j < e.p.length; j++) {
                const q = e.p[j];
                const qr = e.chain ? e.r : (j === 1 ? e.r : e.r * 0.78);
                if (!swept(pts[i], { x: q.x, y: q.y, r: qr }, r)) continue;
                hitPart = j; hitSeg = i; break;
            }
        }
        if (hitPart >= 0) {
            const i = hitSeg, p = pts[i];
            const [vx, vy] = vel(p);
            // У копья считается движение вдоль древка, у клинка — поперёк.
            // Поэтому колоть и рубить это разные действия, а не одно.
            const sp = effSpeed(vx, vy);
            // Ползун стелется: древко проходит над ним при любой скорости,
            // поэтому правило стоит до порога урона, а не после.
            if (e.kind === 'ползун' && i < pts.length - BLADE) {
                e.iframe = 0.1;
                nums.push({ x: e.x, y: e.y - 10, v: 'поверху', t: 0.4 }); cntOver++;
                continue;
            }
            const floor = hitFloor();
            if (sp < floor) {
                // Щитоносец делает обратное нашему захвату: он ловит оружие
                // сам. Освободиться можно только рывком — медленно не выйдет.
                // Медленное касание не бьёт — оно цепляет: цепь обматывает.
                if (!hooked && !e.boss && !e.held && i >= pts.length - BLADE) {
                    hooked = e; e.held = true; grabs++;
                    blip(320, 0.1, 'square', 0.1, 180);
                }
                continue;
            }
            // Ползун стелется по земле: древко и цепь проходят над ним,
            // достаёт только боевая часть. Значит, по нему надо целиться.
            // Щитоносец ловит оружие, если оно летит недостаточно быстро:
            // либо бей его от души, либо будешь вырываться.
            if (e.kind === 'щитоносец' && sp < 1250 && !gripped) {
                gripped = e; gripT = 0; cntGrip++;
                e.held = true; e.iframe = 0.3;
                play('натяг', 0.45, 0.8);
                nums.push({ x: e.x, y: e.y - 12, v: 'схватил!', t: 0.9, big: true });
                continue;
            }
            if (e.chain && hitPart > 0) {           // членистого берёт только голова
                e.iframe = 0.12;
                nums.push({ x: e.p[hitPart].x, y: e.p[hitPart].y - 10, v: 'панцирь', t: 0.4 });
                blip(1500, 0.05, 'square', 0.09);
                continue;
            }
            // Порог брони выведен для хлыста, как когда-то порог урона: у
            // жёсткого оружия скорость по своей природе ниже, и с общим
            // числом копьё не пробивает панцирь ни при каком замахе.
            e.probe++; e.probeSp = Math.max(e.probeSp, Math.round(sp));
            const armor = e.armor * (S.rigid ? 0.45 : 1);
            e.probeArm = Math.round(armor);
            if (armor && sp < armor) {              // панцирь: касание не считается
                e.iframe = 0.12; e.flash = 0.4;
                nums.push({ x: e.x, y: e.y - 10, v: 'бронь', t: 0.45 });
                blip(1500, 0.05, 'square', 0.09);
                continue;
            }
            const mul = i >= pts.length - BLADE ? S.bladeMul * (held ? held.mul : 1) : S.bodyMul;
            const dmg = DMG_K * Math.sqrt(sp - floor) * mul;
            // Точный сильный удар по голове сносит её вместе с врагом.
            // Решается ДО урона: если сначала отнять здоровье, сильнейший
            // удар просто убьёт врага обычным порядком, и до отрыва доживут
            // только живучие на поздних волнах — то есть наоборот.
            if (hitPart === 0 && dmg >= TEAR && !e.boss && !e.dead) {
                nums.push({ x: e.x, y: e.y - 16, v: 'башка!', t: 0.8 });
                if (!play('отрыв', 0.6, 0.95 + Math.random() * 0.2)) blip(520, 0.2, 'square', 0.16, 120);
                kills++; cntEpic++;
                score += Math.round(30 * (1 + dmg / 45));   // за точность вдвое
                kill(e, vx * 0.5, vy * 0.5, true, true);
            } else {
                hurt(e, dmg, vx * 0.30, vy * 0.30, e.p[hitPart]);
            }
            e.iframe = 0.1;
            if (dmg > best) best = dmg;
            if (held && i >= pts.length - BLADE && --held.hits <= 0) {
                blip(300, 0.2, 'square', 0.14, 90);
                const t = pts[pts.length - 1];
                for (let q = 0; q < 6; q++) {
                    bits.push({ x: t.x, y: t.y, vx: rnd(-260, 260), vy: rnd(-260, 260),
                        r: rnd(2, 4), ang: rnd(0, 6.283), spin: rnd(-16, 16), t: 0.8, boss: held.boss });
                }
                held = null;
            }
        }
    }

    // Обвивка: замкнул тело в кольцо — всё внутри стягивается и трещит.
    if (gripped) {
        gripT += dt;
        const t = pts[pts.length - 1];
        if (gripped.dead || gripT > 6) { gripped.held = false; gripped = null; }
        else {
            // Оружие притянуто к нему и почти не движется, пока не рванёшь.
            for (const q of [t, pts[pts.length - 2]]) {
                q.x += (gripped.x - q.x) * 7 * dt;
                q.y += (gripped.y - q.y) * 7 * dt;
            }
            const [hx2, hy2] = vel(pts[0]);
            if (Math.hypot(hx2, hy2) > 780) {          // рывок рукой освобождает
                hurt(gripped, 26, (t.x - gripped.x) * 6, (t.y - gripped.y) * 6);
                gripped.down = Math.max(gripped.down, 0.8);
                gripped.held = false;
                nums.push({ x: gripped.x, y: gripped.y - 14, v: 'вырвал!', t: 0.9, big: true });
                play('отрыв', 0.45, 1.2);
                shake = Math.min(1, shake + 0.4);
                gripped = null;
            }
        }
    }

    if (hooked) {
        const t = pts[pts.length - 1];
        const [tvx, tvy] = vel(t);
        if (hooked.dead) { hooked = null; }
        else {
            hooked.hp -= 3 * dt;
            hooked.squeeze = 1;
            for (const q of hooked.p) {           // тащится за кончиком
                q.x += (t.x - hooked.x) * 6 * dt;
                q.y += (t.y - hooked.y) * 6 * dt;
            }
            hooked.x = hooked.p[1].x; hooked.y = hooked.p[1].y;
            if (hooked.hp <= 0) { kill(hooked); hooked = null; }
            else if (Math.hypot(tvx, tvy) > 620) letGo(hooked);   // разогнал — швырнул
        }
    }

    for (const b of boons) {
        b.t -= dt;
        const hand = pts[0];
        const d = Math.min(Math.hypot(b.x - hand.x, b.y - hand.y),
                           Math.hypot(b.x - hero.x, b.y - hero.y));
        if (d < 26) { b.t = 0; takeBoon(b); }
    }
    boons = boons.filter((b) => b.t > 0);

    for (const o of orbs) {
        const hand = pts[0];
        const dh = Math.hypot(o.x - hand.x, o.y - hand.y);
        const db = Math.hypot(o.x - hero.x, o.y - hero.y);
        const to = dh < db ? hand : hero;
        const d = Math.min(dh, db);
        if (d < 115) { o.x += (to.x - o.x) * 4.5 * dt; o.y += (to.y - o.y) * 4.5 * dt; }
        if (d < 22) { o.dead = true; grow(1); blip(880, 0.06, 'sine', 0.09); }
    }
    orbs = orbs.filter((o) => !o.dead);
    for (const b of bits) {
        b.t -= dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        const fr = b.fr || 0.955;
        b.vx *= fr; b.vy *= fr;
        b.ang += b.spin * dt;
        if (b.x < WALL + b.r || b.x > W - PAD - b.r) { b.vx *= -0.5; b.spin *= -0.7; }
        if (b.y < PAD + b.r || b.y > H - PAD - b.r) { b.vy *= -0.5; b.spin *= -0.7; }
        b.x = Math.max(WALL + b.r, Math.min(W - PAD - b.r, b.x));
        b.y = Math.max(PAD + b.r, Math.min(H - PAD - b.r, b.y));
    }
    for (const b of bits) {
        if (!b.grab || held) continue;
        const near = Math.min(
            Math.hypot(b.x - hero.x, b.y - hero.y),
            Math.hypot(b.x - pts[0].x, b.y - pts[0].y),   // рукой тоже можно
        );
        if (near > b.r + 22) continue;
        b.t = 0;
        held = { hits: b.boss ? 14 : 7, mul: b.boss ? 2.4 : 1.7, mass: b.boss ? 0.5 : 0.4, r: b.r * 1.5, boss: b.boss };
        blip(150, 0.16, 'square', 0.14, 320);
        buzz(25);
    }
    for (const b of bits) {
        if (b.t <= 0 && b.wet) stain(b.x, b.y, b.r * 1.9, b.wet, 0.42);
    }
    bits = bits.filter((b) => b.t > 0);
    for (const n of nums) { n.t -= dt; n.y -= 26 * dt; }
    nums = nums.filter((n) => n.t > 0);
    if (shake > 0) shake = Math.max(0, shake - dt * 6);
    if (gate.hit > 0) gate.hit = Math.max(0, gate.hit - dt * 3);
    // Смена арены — состояние, а не рисование: держать её в drawGround
    // значит поставить ход игры в зависимость от того, рисуем ли мы сейчас.
    // Проверить такое без экрана нельзя, и первая же проба это показала.
    const bi = biomeIdx();
    if (bi !== biomeShown) {
        biomeWas = biomeShown < 0 ? bi : biomeShown;
        biomeShown = bi;
        biomeFade = biomeWas === bi ? 1 : 0;
    }
    if (biomeFade < 1) { biomeFade = Math.min(1, biomeFade + dt / 1.5); cntFade++; }
    for (const m of marks) m.t -= dt;
    marks = marks.filter((m) => m.t > 0);
}

/** Ворота теряют здоровье видимо: трещинами и креном, а не числом. */
function hurtGate(dmg, y) {
    if (gate.hp <= 0) return;
    gate.hp = Math.max(0, gate.hp - dmg);
    gate.hit = 1;
    shake = Math.min(1, shake + dmg / 40);
    blip(90 + rnd(0, 30), 0.16, 'square', 0.13, 50);
    for (let k = 0; k < 3; k++) {
        bits.push({ x: WALL + 6, y: (y || H / 2) + rnd(-14, 14),
            vx: rnd(40, 220), vy: rnd(-140, 140),
            r: rnd(1.6, 3.2), ang: 0, spin: rnd(-9, 9), t: 0.45, wet: '#5a4630' });
    }
    if (gate.hp <= 0) { dead = 1.4; gateLost = true; blip(60, 0.9, 'sawtooth', 0.26, 30); }
}

function hurt(e, dmg, kx, ky, part) {
    e.hp -= dmg;
    const kr = 1 / e.mass;          // тушу так просто не отбросишь, бегуна сдувает
    const q = part || e.p[1];
    push(q, kx * kr, ky * kr);
    for (const o of e.p) if (o !== q) push(o, kx * kr * 0.3, ky * kr * 0.3);
    if (dmg > 40) slow = Math.max(slow, 0.09);
    if (dmg > 14 && !e.boss && !e.chain) e.down = Math.max(e.down, 0.6 + dmg / 60);
    if (dmg > 18) stain(q.x, q.y, 3.5, e.dark, 0.3);   // брызги остаются на земле
    e.flash = 1;
    nums.push({ x: e.x, y: e.y, v: Math.round(dmg), t: 0.6, big: dmg > 25 });
    hitCd -= DT;
    if (hitCd <= 0 && play('лязг', Math.min(0.55, 0.14 + dmg / 130), 0.85 + Math.random() * 0.4)) {
        hitCd = 0.05;
    } else {
        blip(210 + rnd(0, 70), 0.13, 'triangle', Math.min(0.3, 0.05 + dmg / 260), 60);
    }
    shake = Math.min(1, shake + dmg / 120);
    if (e.hp <= 0 && !e.dead) {
        kills++;
        score += Math.round((e.boss ? 300 : 12) * (1 + dmg / 45));
        if (e.boss || kills % 5 === 0) dropBoon(e.x, e.y, 'усиление');
        kill(e, kx, ky);
    }
}

/**
 * Раскрыл петлю на ходу — схваченный улетает с её скоростью. Отдельной
 * кнопки нет: бросок это то же движение, которым ты и так машешь.
 */
function letGo(e) {
    e.held = false;
    if (hooked === e) hooked = null;
    const t = pts[pts.length - 1];
    const [vx, vy] = vel(t);
    const sp = Math.hypot(vx, vy);
    if (sp < 260 || e.dead) return;                 // просто разжал, не бросок
    for (const q of e.p) push(q, vx * 0.85, vy * 0.85);
    e.flying = 0.9;
    e.down = Math.max(e.down, 1.1);      // после полёта надо ещё встать
    e.iframe = 0.1;
    thrown++;
    blip(240, 0.16, 'sawtooth', 0.13, 520);
    nums.push({ x: e.x, y: e.y - 14, v: 'бросок', t: 0.6 });
}

/** Летящее тело — снаряд: и само бьётся, и сносит тех, в кого прилетело. */
function flying(e, dt) {
    e.flying -= dt;
    const q = e.p[1];
    const vx = (q.x - q.px) / DT, vy = (q.y - q.py) / DT;
    const sp = Math.hypot(vx, vy);
    if (sp < 300) return;
    for (const o of foes) {
        if (o === e || o.dead || o.held || o.iframe > 0) continue;
        if (Math.hypot(o.x - e.x, o.y - e.y) > o.r + e.r) continue;
        o.iframe = 0.16; e.iframe = 0.16;
        const dmg = sp / 30;
        hurt(o, dmg, vx * 0.45, vy * 0.45);
        if (!e.dead) hurt(e, dmg * 0.5, -vx * 0.15, -vy * 0.15);
        score += 8;                                  // за попадание телом в тело
        shake = Math.min(1, shake + 0.3);
        break;
    }
}

/** Импульс последнего удара уносит ошмётки: видно, откуда прилетело. */
function kill(e, kx = 0, ky = 0, sure = false, epic = false) {
    e.dead = true;
    if (e === gripped) { gripped = null; }
    // Колючий разлетается иглами: убивать его выгодно посреди толпы.
    if (e.kind === 'колючий') {
        cntBoom++;
        blip(300, 0.25, 'square', 0.18, 90);
        shake = Math.min(1, shake + 0.5);
        for (const o of foes) {
            if (o === e || o.dead) continue;
            const d = Math.hypot(o.x - e.x, o.y - e.y);
            if (d > 78) continue;
            const f = 1 - d / 78;
            hurt(o, 26 * f, (o.x - e.x) / (d || 1) * 700 * f, (o.y - e.y) / (d || 1) * 700 * f);
        }
        if (Math.hypot(hero.x - e.x, hero.y - e.y) < 46 && hero.iframe <= 0 && !dead) {
            hero.iframe = 0.9; hero.hp -= 1;
            if (hero.hp <= 0) { dead = 1.4; blip(70, 0.7, 'sawtooth', 0.25, 35); }
        }
        for (let k = 0; k < 12; k++) {
            const a = rnd(0, 6.283), sp2 = rnd(200, 480);
            bits.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2,
                r: rnd(2, 4), ang: a, spin: rnd(-14, 14), t: rnd(0.4, 0.9), boss: false });
        }
    }
    stain(e.x, e.y, e.r * 1.4, e.dark, 0.5);
    blip(e.boss ? 180 : 640, e.boss ? 0.5 : 0.09, 'square', e.boss ? 0.22 : 0.07, e.boss ? 50 : 0);
    for (let k = 0; k < (e.boss ? 8 : 1); k++) {
        orbs.push({ x: e.x + rnd(-22, 22), y: e.y + rnd(-22, 22) });
    }
    const push = Math.min(700, Math.hypot(kx, ky) * 0.45);
    const dir = Math.atan2(ky, kx);

    // Брызги — то, чего не хватало: капли летят веером по удару и оставляют
    // пятно там, где упали. Одни ошмётки давали аккуратную россыпь, а не
    // разлёт: «весь экран в брызгах» получается именно из следов.
    // Отрыв головы редок, поэтому он большой. Ощущение «весь экран в брызгах»
    // рождается из разницы с обычным ударом, а не из площади: залить всё
    // каждый раз — значит превратить это в фон.
    const wet = epic ? 90 : (e.boss ? 26 : 16);
    for (let k = 0; k < wet; k++) {
        // Треть капель уходит далеко, остальные оседают рядом: иначе
        // девяносто одинаковых чёрточек ложатся ровным ковром по всему
        // экрану и читаются сором, а не веером из одного места.
        const far = epic && k % 3 === 0;
        const a = epic ? rnd(0, 6.283) : dir + rnd(-0.9, 0.9);
        const sp = epic ? (far ? rnd(760, 1600) : rnd(160, 560))
            : rnd(220, 700) + push * 0.6;
        bits.push({
            x: e.x + rnd(-4, 4), y: e.y + rnd(-4, 4),
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            r: epic ? (far ? rnd(1.5, 2.6) : rnd(2.4, 5.4)) : rnd(1.6, 3.4),
            ang: a, spin: rnd(-6, 6),
            t: epic ? rnd(0.5, 1.1) : rnd(0.25, 0.6),
            fr: epic ? (far ? 0.985 : 0.955) : 0.955,
            boss: e.boss, wet: e.dark,
        });
    }
    if (epic) {
        slow = Math.max(slow, 0.26);
        shake = 1;
        for (let k = 0; k < 10; k++) {         // и след остаётся широкий
            const a = rnd(0, 6.283), d = rnd(20, 120);
            stain(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, rnd(6, 16), e.dark, 0.4);
        }
    }
    // И пятно под самим телом — широкое, а не точка.
    for (let k = 0; k < 4; k++) {
        stain(e.x + Math.cos(dir) * k * 9 + rnd(-7, 7),
              e.y + Math.sin(dir) * k * 9 + rnd(-7, 7),
              e.r * (1.5 - k * 0.2), e.dark, 0.5);
    }

    const n = epic ? 20 : (e.boss ? 18 : 12);
    for (let k = 0; k < n; k++) {
        const a = k ? rnd(0, 6.283) : dir;                 // первый кусок летит по удару
        const sp = rnd(70, 300) + (k ? push * 0.5 : push);
        bits.push({
            x: e.x + rnd(-5, 5), y: e.y + rnd(-5, 5),
            vx: Math.cos(a) * sp + Math.cos(dir) * push * 0.4,
            vy: Math.sin(a) * sp + Math.sin(dir) * push * 0.4,
            r: (k ? rnd(2, 5.5) : rnd(5.5, 8)) * (e.boss ? 1.7 : 1) * (epic ? 1.4 : 1),
            ang: rnd(0, 6.283), spin: rnd(-16, 16),
            t: k ? rnd(0.55, 1.2) : 9,          // крупный кусок лежит и ждёт
            grab: !k && (sure || e.boss || rnd(0, 1) < 0.35), boss: e.boss,
        });
    }
}

function grow(n) {
    // Растём на три звена от своего оружия: дальше цеп перестаёт слушаться,
    // а меч перестаёт быть мечом.
    for (let k = 0; k < n && pts.length < S.len0 + 3; k++) {
        const t = pts[pts.length - 1];
        pts.push({ x: t.x, y: t.y, px: t.px, py: t.py });
    }
    S.len = pts.length;
    ui();
}

function shrink(n) {
    for (let k = 0; k < n && pts.length > 4; k++) pts.pop();
    S.len = pts.length;
    ui();
}

/* ──────────────────────────── Враги и камень ───────────────────────────── */

function startWave() {
    wave++;
    const bossWave = wave % 5 === 0;
    theme = pickTheme(wave, theme && theme[0]);
    bossDone = false;
    // На волне босса тоже приходит толпа — иначе туша остаётся один на один
    // с оружием и волна выходит легче обычной.
    seedBarrels();
    spawnLeft = bossWave
        ? 1 + Math.round(3 + wave * 0.6)
        : Math.min(30, Math.round((4 + wave * 1.6) * theme[1].size));
    spawnTimer = 0.5;
    paused = false;
    blip(520, 0.1, 'sine', 0.1); blip(780, 0.16, 'sine', 0.08);
    $('cards').classList.remove('on');
    ui();
}

/**
 * Враги отличаются не числом здоровья, а физикой: массой, длиной тела,
 * вязкостью и скоростью. Лёгкий бегун улетает от касания, толстяк почти
 * не сдвигается, щитоносца вообще нельзя задеть медленным оружием.
 */
const KINDS = {
    ходок:     { hp: 18, walk: 52, r: 10, link: 11, damp: 0.962, mass: 1.0, armor: 0,   color: '#c2566b', dark: '#8f3a4c' },
    бегун:     { hp: 10, walk: 98, r: 8,  link: 9,  damp: 0.950, mass: 0.5, armor: 0,   color: '#dd8b3c', dark: '#a4602a' },
    толстяк:   { hp: 48, walk: 31, r: 15, link: 15, damp: 0.980, mass: 2.6, armor: 0,   color: '#9a63c4', dark: '#6d4590' },
    щитоносец: { hp: 26, walk: 44, r: 11, link: 11, damp: 0.970, mass: 1.5, armor: 700, color: '#4f93ad', dark: '#356878' },
    туша:      { hp: 200, walk: 34, r: 26, link: 24, damp: 0.975, mass: 4.5, armor: 900,  color: '#59626e', dark: '#4d5561' },
    ползун:    { hp: 30, walk: 40, r: 13, link: 9,  damp: 0.985, mass: 1.8, armor: 0, color: '#6f9a4e', dark: '#4c6b35' },
    прыгун:    { hp: 14, walk: 78, r: 9,  link: 12, damp: 0.940, mass: 0.45, armor: 0, color: '#c0a458', dark: '#8a7436' },
    верзила:   { hp: 60, walk: 36, r: 17, link: 14, damp: 0.982, mass: 3.0, armor: 0, color: '#a35a3c', dark: '#6f3a26' },
    колючий:   { hp: 20, walk: 58, r: 10, link: 10, damp: 0.960, mass: 0.9, armor: 0, color: '#4a5fa8', dark: '#33437a' },
    оболочка:  { hp: 24, walk: 50, r: 11, link: 13, damp: 0.955, mass: 0.7, armor: 0, color: '#3fa08d', dark: '#2a6f61' },
    червь:     { hp: 260, walk: 62, r: 19, link: 25, damp: 0.972, mass: 3.2, armor: 0,    color: '#7a8a4e', dark: '#4d5a2f', chain: 11 },
};

/**
 * У волны есть характер. Ровная смесь всех видов быстро превращается в
 * однообразие: к десятой волне каждая выглядит как предыдущая. Поэтому
 * волна выбирает тему — толпу, наскок, тяжёлых или стену щитов — и тема
 * задаёт и состав, и то, насколько их много.
 */
const THEMES = [
    ['толпа',   { needs: null,        size: 1.5, mix: { ходок: 1, бегун: 0.4 } }],
    ['наскок',  { needs: 'бегун',     size: 1.2, mix: { бегун: 1, ходок: 0.25 } }],
    ['тяжёлые', { needs: 'толстяк',   size: 0.55, mix: { толстяк: 1, ходок: 0.35 } }],
    ['стена',   { needs: 'щитоносец', size: 0.8, mix: { щитоносец: 1, ходок: 0.35 } }],
    ['вразнос', { needs: 'толстяк',   size: 1.0, mix: { ходок: 1, бегун: 0.9, толстяк: 0.5, щитоносец: 0.4 } }],
    ['ползком',  { needs: 'ползун',    size: 1.3, mix: { ползун: 1, ходок: 0.3 } }],
    ['иглы',     { needs: 'колючий',   size: 0.9, mix: { колючий: 1, ходок: 0.3 } }],
    ['стая',     { needs: 'прыгун',    size: 1.4, mix: { прыгун: 1, бегун: 0.5 } }],
    ['громилы',  { needs: 'верзила',   size: 0.5, mix: { верзила: 1, толстяк: 0.4 } }],
    ['пустые',   { needs: 'оболочка',  size: 1.0, mix: { оболочка: 1, бегун: 0.4 } }],
];

/** Когда вид впервые выходит на арену. */
/*
 * Раньше первые две волны состояли из одних ходоков, и умерший на третьей
 * честно говорил «враг всё ещё один» — он больше никого и не видел.
 * Теперь новый вид выходит почти каждую волну, и каждому отдаётся дебют.
 */
const UNLOCK = {
    ходок: 1, бегун: 2, ползун: 3, толстяк: 4, колючий: 5,
    прыгун: 6, щитоносец: 7, верзила: 9, оболочка: 11,
};

function pickTheme(w, avoid) {
    // Волна, на которой вид открывается, целиком отдаётся ему: иначе новый
    // враг теряется в толпе и игрок его не замечает.
    const debut = THEMES.find(([, t]) => t.needs && UNLOCK[t.needs] === w);
    if (debut) return debut;
    const ok = THEMES.filter(([name, t]) =>
        (!t.needs || w >= UNLOCK[t.needs]) && name !== avoid);
    return ok.length ? ok[Math.floor(rnd(0, ok.length))] : THEMES[0];
}

function pickKind(w, mix) {
    const list = Object.entries(mix).filter(([k]) => w >= UNLOCK[k]);
    let t = rnd(0, list.reduce((a, x) => a + x[1], 0));
    for (const [key, weight] of list) if ((t -= weight) <= 0) return key;
    return 'ходок';
}

/** Голова, туловище, ноги — та же цепь, что и у оружия, только короткая. */
const body = (x, y, link, n = 3) => {
    const out = [];
    for (let i = 0; i < n; i++) {
        const yy = y - link + i * link;
        out.push({ x, y: yy, px: x, py: yy });
    }
    return out;
};

function stick(a, b, len) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1e-6;
    const k = (d - len) / d * 0.5;
    a.x += dx * k; a.y += dy * k;
    b.x -= dx * k; b.y -= dy * k;
}

/** Толчок в верле задаётся сдвигом прошлой позиции. */
const push = (q, ax, ay) => { q.px -= ax * DT; q.py -= ay * DT; };

/** Поставить конкретного врага в конкретное место — для съёмки и отладки. */
function spawnAt(kind, x, y) {
    const k = KINDS[kind];
    const hp = Math.round(k.hp * (1 + wave * 0.16));
    foes.push({
        x, y, kind, boss: false, hp, hp0: hp,
        r: k.r, link: k.link, walk: k.walk, damp: k.damp, mass: k.mass, armor: k.armor,
        color: k.color, dark: k.dark, chain: k.chain || 0, step: 0, down: 0, smack: 0,
        iframe: 0, flash: 0, squeeze: 0, touch: 0, held: false, flying: 0,
        p: body(x, y, k.link, k.chain || 3),
    });
    return foes[foes.length - 1];
}

function spawn() {
    // Враг заводится ЗА краем и заходит сам. Раньше он возникал в двадцати
    // единицах внутри поля — со стороны это читалось телепортацией: «фигак,
    // и новые монстры». Разница только в знаке координаты, а ощущение другое:
    // видно, откуда идут, и есть секунда развернуться.
    // Слева стена — оттуда никто не приходит. Враги идут снаружи замка:
    // справа, сверху и снизу.
    const edge = Math.floor(rnd(0, 3));
    const out = 42;
    const x = edge === 0 ? W + out : rnd(WALL + 40, W - 30);
    const y = edge === 1 ? -out : edge === 2 ? H + out : rnd(30, H - 30);
    // Метка на кромке: показывает место входа, пока сам он ещё за экраном.
    marks.push({
        x: Math.max(10, Math.min(W - 10, x)),
        y: Math.max(10, Math.min(H - 10, y)), t: 1.1,
    });
    cntIn++;
    const boss = wave % 5 === 0 && !bossDone;
    if (boss) bossDone = true;                    // на волне босса ещё приходит свита
    // Боссы чередуются: панцирная туша и членистый червь.
    const kind = boss ? ((wave / 5) % 2 === 0 ? 'червь' : 'туша') : pickKind(wave, theme[1].mix);
    const k = KINDS[kind];
    const hp = Math.round(k.hp * (boss ? 1 + wave * 0.9 : 1 + wave * 0.16));
    foes.push({
        x, y, kind, boss, hp, hp0: hp,
        r: k.r, link: k.link, walk: k.walk, damp: k.damp, mass: k.mass, armor: k.armor,
        color: k.color, dark: k.dark,
        iframe: 0, flash: 0, squeeze: 0, touch: 0,
        chain: k.chain || 0, step: 0, down: 0, smack: 0, entering: true, wallY: pickWallSpot(),
        p: body(x, y, k.link, k.chain || 3), held: false, flying: 0,
    });
}

function moveFoes(dt) {
    tickBarrels(dt);
    if (trial) { tickTrial(dt); }
    else if (spawnLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0 && foes.length < 30) {
            spawnTimer = Math.max(0.2, 0.9 - wave * 0.05);
            spawn(); spawnLeft--;
        }
    } else if (foes.length <= 2 && !paused && !trial && !filming) {
        // При съёмке волны не идут: сцену ставит снимающий, и подсыпать в неё
        // врагов нельзя — иначе «дуга без врагов» не останется без врагов.
        // Волна не «зачищается»: следующая начинается, пока предыдущая ещё
        // догорает. В референсе давление не спадает ни на секунду, а у нас
        // между волнами был провал — именно он и читался как «не нарастает».
        dropBoon(hero.x, hero.y - 40, wave % 3 === 0 ? 'оружие' : 'усиление');
        score += 40 * wave;
        startWave();
    }

    hero.iframe -= dt;
    for (const e of foes) {
        const damp = e.damp;
        for (const q of e.p) {
            const vx = (q.x - q.px) * damp, vy = (q.y - q.py) * damp;
            q.px = q.x; q.py = q.y;
            q.x += vx; q.y += vy;
        }
        // Враг идёт к воротам, а не к герою: герой ему не нужен, ему нужен
        // замок. Но вблизи он переключается на героя — иначе мимо стоящего
        // игрока толпа просто протекает, и драки нет вовсе.
        const hx = hero.x - e.p[1].x, hy = hero.y - e.p[1].y;
        const hd = Math.hypot(hx, hy) || 1;
        const aim = gateAim(e);
        const toHero = hd < 96 || gate.hp <= 0 || e.boss;
        const dx = toHero ? hx : aim.x - e.p[1].x;
        const dy = toHero ? hy : aim.y - e.p[1].y;
        const d = toHero ? hd : (Math.hypot(dx, dy) || 1);
        if (e.down > 0) {
            e.down -= dt;                           // лежит: не идёт и не мешает
        } else if (e.flying > 0) {
            flying(e, dt);                          // летит — не идёт
        } else if (!e.held) {
            const walk = e.walk * dt;
            const wx = dx / d * walk, wy = dy / d * walk;
            // У членистого ведёт голова, остальное тянется связями следом.
            const movers = e.chain ? [e.p[0]] : e.p;
            for (const q of movers) {
                q.x += wx; q.y += wy;
                q.px += wx; q.py += wy;   // сдвигаем и прошлую точку, иначе шаг копится в скорости
            }
            e.step += Math.hypot(wx, wy) / e.link;   // фаза шага идёт от пройденного пути
        }
        for (let k = 0; k < 2; k++) {
            for (let i = 1; i < e.p.length; i++) stick(e.p[i - 1], e.p[i], e.link);
            if (!e.chain) stick(e.p[0], e.p[2], e.link * 1.75);   // чтобы не складывался пополам
        }
        const m = e.r * 0.7;
        for (const q of e.p) {
            // Заходящего стены ещё не держат — иначе он прилипнет к кромке
            // снаружи и войти не сможет вовсе.
            const nx = e.entering ? q.x : Math.max(WALL + m, Math.min(W - PAD - m, q.x));
            const ny = e.entering ? q.y : Math.max(PAD + m, Math.min(H - PAD - m, q.y));
            // Влетевшего в стену бьёт о стену: у броска появляется адрес.
            if (q === e.p[1] && (nx !== q.x || ny !== q.y) && e.flying > 0 && e.smack <= 0) {
                const sp = Math.hypot(q.x - q.px, q.y - q.py) / DT;
                if (sp > 500) {
                    e.smack = 0.4;
                    hurt(e, sp / 34, 0, 0);
                    shake = Math.min(1, shake + 0.4);
                    blip(120, 0.2, 'square', 0.16, 60);
                }
            }
            q.x = nx; q.y = ny;
        }
        e.smack -= dt;
        e.x = e.p[1].x; e.y = e.p[1].y;
        if (!e.entering && !e.dead && e.down <= 0 && gate.hp > 0) {
            const уСтены = e.x < WALL + e.r + 10;
            const уВорот = уСтены && e.y > gateTop() && e.y < gateBot();
            if (уВорот) {
                // Ворота грызут: урон идёт постоянно, пока враг стоит вплотную.
                e.gnaw = (e.gnaw || 0) + dt;
                if (e.gnaw > 0.6) {
                    e.gnaw = 0;
                    hurtGate(2.6 * e.mass, e.y);
                }
                e.climb = 0;
            } else if (уСтены) {
                // Мимо ворот — лезет через стену. Это и есть повод отойти:
                // стоять у ворот безопасно, но пролезших не увидишь.
                e.climb = (e.climb || 0) + dt;
                if (e.climb >= CLIMB) {
                    e.climb = 0;
                    hurtGate(9, e.y);
                    gate.over++;
                    for (let k = 0; k < 8; k++) {
                        bits.push({ x: e.x, y: e.y, vx: rnd(-160, 60), vy: rnd(-160, 160),
                            r: rnd(2, 4), ang: 0, spin: rnd(-8, 8), t: 0.5, wet: e.dark });
                    }
                    e.dead = true;      // перелез: он уже внутри, его не достать
                }
            } else { e.climb = 0; e.gnaw = 0; }
        }
        // Вошёл целиком — дальше он такой же, как все, и стены его держат.
        if (e.entering && e.x > WALL + e.r && e.x < W - PAD - e.r
            && e.y > PAD + e.r && e.y < H - PAD - e.r) e.entering = false;
        // Гипотеза из референса: у прямоугольной арены углы это ловушки.
        // Меряем, сколько времени тела действительно там проводят.
        bodySamples++;
        const cx = Math.min(e.x, W - e.x), cy = Math.min(e.y, H - e.y);
        if (cx < 80 && cy < 80) inCorner++;
        e.flash = Math.max(0, e.flash - dt * 5);
        e.squeeze = Math.max(0, e.squeeze - dt * 4);
        e.touch -= dt;
        // Между досягаемостью тела и дугой оружия был зазор в десяток единиц,
        // и висящего в нём врага не брало ничто: ни удар, ни толчок.
        if (d < e.r + HERO_R + 14 && e.touch <= 0 && hero.iframe <= 0 && !dead) {
            // Оружие висит на вытянутой руке и метёт дугу снаружи, поэтому
            // прижавшегося вплотную нечем достать. Значит, столкновение с
            // героем должно отбрасывать врага на длину оружия, а не на шаг:
            // иначе он приклеивается и волна не кончается никогда.
            e.touch = 1; hero.iframe = 0.9;
            e.down = Math.max(e.down, 0.5);
            // Толчок делится на массу, как и удар: иначе тушу отбрасывает так
            // же далеко, как бегуна, и она уходит из досягаемости навсегда.
            const shove = 1400 / e.mass;
            for (const q of e.p) push(q, -dx / d * shove, -dy / d * shove);
            // Оружие не достаёт вплотную, поэтому налетевший получает от самого
            // героя. Даром это не даётся: за размен платят сердцем, так что
            // толкаться специально невыгодно — но приклеиться уже нельзя.
            if (!e.boss) hurt(e, 14, -dx / d * 120, -dy / d * 120);
            hero.hp -= 1; shake = 1;
            blip(95, 0.28, 'sawtooth', 0.2, 45); buzz(80);
            if (hero.hp <= 0) { dead = 1.4; blip(70, 0.7, 'sawtooth', 0.25, 35); }
        }
    }
    foes = foes.filter((e) => !e.dead);
}

function moveRock(dt) {
    rock.x += rock.vx * dt; rock.y += rock.vy * dt;
    rock.vx *= 0.995; rock.vy *= 0.995;
    if (rock.x < PAD + rock.r) { rock.x = PAD + rock.r; rock.vx = Math.abs(rock.vx) * 0.8; }
    if (rock.x > W - PAD - rock.r) { rock.x = W - PAD - rock.r; rock.vx = -Math.abs(rock.vx) * 0.8; }
    if (rock.y < PAD + rock.r) { rock.y = PAD + rock.r; rock.vy = Math.abs(rock.vy) * 0.8; }
    if (rock.y > H - PAD - rock.r) { rock.y = H - PAD - rock.r; rock.vy = -Math.abs(rock.vy) * 0.8; }

    // Тело бьёт по камню — камень улетает и косит всё на пути.
    for (let i = 1; i < pts.length; i++) {
        const p = pts[i], r = radiusAt(i);
        const dx = rock.x - p.x, dy = rock.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d > r + rock.r) continue;
        const ov = r + rock.r - d;
        rock.x += dx / d * ov; rock.y += dy / d * ov;
        const [vx, vy] = vel(p);
        const along = (vx * dx + vy * dy) / d;
        if (along > 0) { rock.vx += dx / d * along * 0.28; rock.vy += dy / d * along * 0.28; }
        // Звено разгоняется до тысяч; без потолка камень улетает быстрее,
        // чем глаз успевает его найти.
        const rs = Math.hypot(rock.vx, rock.vy);
        if (rs > ROCK_MAX) { rock.vx *= ROCK_MAX / rs; rock.vy *= ROCK_MAX / rs; }
    }

    const rs = Math.hypot(rock.vx, rock.vy);
    if (rs > 200) {
        for (const e of foes) {
            if (e.iframe > 0) continue;
            if (Math.hypot(rock.x - e.x, rock.y - e.y) > rock.r + e.r) continue;
            e.iframe = 0.15;
            hurt(e, rs / 26, rock.vx * 0.5, rock.vy * 0.5);
        }
    }
}

/* ─────────────────────────────── Оружие ───────────────────────────────── */
