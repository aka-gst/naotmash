/* ──────────────────────────────── Звук ─────────────────────────────────── */

let ac = null, hiss = null, hissGain = null, hissBand = null;

/**
 * Записанные звуки. Грузятся лениво, после первого касания: игра должна
 * открываться мгновенно, а звук нужен только когда уже играешь. Не
 * загрузились — остаётся синтезированный звук, игра не ломается.
 */
const SFX = {
    свист:    ['whoosh-slow-1', 'whoosh-slow-2', 'whoosh-slow-3'],
    вжик:     ['whoosh-fast-1', 'whoosh-fast-2', 'whoosh-fast-3'],
    лязг:     ['chain-rattle-1', 'chain-rattle-2', 'chain-rattle-3'],
    натяг:    ['chain-stiffen-1', 'chain-stiffen-2', 'chain-stiffen-3'],
    отрыв:    ['tear-head-1', 'tear-head-2', 'tear-head-3'],
};
const wav = {};
let swingCd = 0, hitCd = 0;

async function loadSfx() {
    for (const [key, names] of Object.entries(SFX)) {
        wav[key] = [];
        for (const n of names) {
            try {
                const r = await fetch('sfx/' + n + '.wav');
                if (!r.ok) continue;
                wav[key].push(await ac.decodeAudioData(await r.arrayBuffer()));
            } catch { /* нет файла — переживём */ }
        }
    }
}

function play(key, vol, rate) {
    const list = wav[key];
    if (!ac || !S.sound || !list || !list.length) return false;
    const src = ac.createBufferSource();
    src.buffer = list[Math.floor(Math.random() * list.length)];
    src.playbackRate.value = rate || 1;
    const g = ac.createGain();
    g.gain.value = vol;
    src.connect(g).connect(ac.destination);
    src.start();
    return true;
}

/**
 * Общий уговор всех наших игр: `?тихо` (можно `?quiet`) не заводит звук
 * вовсе. Именно «не заводит», а не «приглушает»: приглушённый контекст
 * оживает сам при переразмере окна и при возврате во вкладку, и обход снова
 * слышно на колонках. Съёмочные и проверочные режимы молчат сами.
 */
// Битый процент в адресе (`?%zz`) — обычное дело: мессенджер обрезал ссылку,
// автозамена съела символ. decodeURIComponent на таком бросает URIError, а
// разбор стоит во входном файле — значит рушится вся игра, а не параметр.
// Человек по такой ссылке видел отладочный пульт вместо выбора оружия.
/**
 * Весь разбор адреса — одной чистой функцией, чтобы его можно было позвать из
 * проверки без браузера (`node tools/proverka-adresa.mjs`). Разбор, живущий
 * только во входном файле, — слепое пятно: ошибка в нём переживает любые
 * зелёные наборы, потому что запустить его негде.
 */
function readAddress(raw) {
    let ask = raw;
    try { ask = decodeURIComponent(raw); } catch { /* битый процент — берём как есть */ }
    const still = /(^|[?&#])(кадр|still)(=|[&#]|$)/i.test(ask);
    return {
        ask,
        quiet: /(^|[?&#])(тихо|quiet)(=1|=true)?([&#]|$)/i.test(ask)   // общее на все игры
            || /(^|[?&#])(loop|петля|кадр|still|flow|test)(=|[&#]|$)/i.test(ask),
        still,
        // Бот-страж: кружит у ворот, а не посреди арены. Нужен, чтобы у
        // проверки был и зелёный исход: если ворота не удерживает и он,
        // оборона невыполнима, а невыполнимое человек считает поломкой.
        guard: /(^|[?&#])(страж|guard)(=|[&#]|$)/i.test(ask),
        loop: still ? 3 : parseInt((ask.match(/(?:петля|loop)=(\d+)/) || [])[1], 10),
    };
}
const ADDR = readAddress(location.search);
const ASK = ADDR.ask;
const QUIET = ADDR.quiet;

/** Контекст можно завести только из настоящего касания. */
function audioOn() {
    if (QUIET || ac || !S.sound) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const n = ac.sampleRate * 1.5 | 0;
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    hiss = ac.createBufferSource(); hiss.buffer = buf; hiss.loop = true;
    hissBand = ac.createBiquadFilter(); hissBand.type = 'bandpass'; hissBand.Q.value = 1.3;
    hissGain = ac.createGain(); hissGain.gain.value = 0;
    hiss.connect(hissBand).connect(hissGain).connect(ac.destination);
    hiss.start();
    loadSfx();
}

/** Свист замаха: и громкость, и высота идут прямо за скоростью кончика. */
function hum(sp) {
    if (!ac) return;
    // Настоящий свист на разгоне, шум — только подложка под ним.
    swingCd -= 1 / 60;
    if (sp > 520 && swingCd <= 0) {
        const fast = sp > 1100;
        if (play(fast ? 'вжик' : 'свист', fast ? 0.5 : 0.32, 0.9 + Math.random() * 0.3)) {
            swingCd = fast ? 0.26 : 0.42;
        }
    }
    const quiet = wav['вжик'] && wav['вжик'].length ? 0.45 : 1;
    const t = S.sound ? Math.min(1, Math.max(0, (sp - 300) / 3800)) : 0;
    hissGain.gain.setTargetAtTime(t * t * 0.2 * quiet, ac.currentTime, 0.05);
    hissBand.frequency.setTargetAtTime(320 + t * 2100, ac.currentTime, 0.05);
}

function blip(f, dur, type, vol, to) {
    if (!ac || !S.sound) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, ac.currentTime);
    if (to) o.frequency.exponentialRampToValueAtTime(to, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + 0.01);
}

const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch { /* не везде есть */ } };

/* ─────────────────────────── Бочки ────────────────────────────────────── */

/**
 * Бочку можно разбить замахом или швырнуть в неё врага. Взрыв бьёт всех
 * вокруг, включая героя, — поэтому стоять рядом невыгодно, и арена
 * перестаёт быть пустой комнатой.
 */
/** Что стоит на арене. Твёрдое мешает ходить, ломкое ломается, яма глотает. */
const PROPS = {
    бочка: { r: 17, hp: 1,  solid: true,  boom: true,  spr: 'obstacle-barrel' },
    ящик:  { r: 18, hp: 1,  solid: true,  boom: false, spr: 'obstacle-crate' },
    столб: { r: 15, hp: 3,  solid: true,  boom: false, spr: 'obstacle-pillar' },
    яма:   { r: 26, hp: 0,  solid: false, boom: false, spr: null },
};

function seedBarrels() {
    barrels = [];
    const put = (kind, n) => {
        for (let i = 0; i < n; i++) {
            const k = PROPS[kind];
            barrels.push({ kind, x: rnd(70, W - 70), y: rnd(100, H - 100),
                r: k.r, hp: k.hp, dead: false });
        }
    };
    put('бочка', 2 + Math.floor(wave / 4));
    put('ящик', 2);
    put('столб', 1 + Math.floor(wave / 5));
    put('яма', 1 + Math.floor(wave / 6));
}

/** Провалившегося в яму не спасает ничего: это не урон, а конец. */
function swallow(e) {
    if (e.dead || e.boss) return;
    nums.push({ x: e.x, y: e.y - 12, v: 'в яму!', t: 0.9, big: true });
    blip(140, 0.4, 'sine', 0.16, 50);
    score += 25;
    kills++;
    kill(e);
}

function blowBarrel(b) {
    b.dead = true;
    blown++;
    if (!PROPS[b.kind].boom) {         // ящик и столб просто рассыпаются
        for (let k = 0; k < 8; k++) {
            const a = rnd(0, 6.283), sp = rnd(120, 340);
            bits.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                r: rnd(2, 4.5), ang: a, spin: rnd(-14, 14), t: rnd(0.4, 0.9), boss: true });
        }
        blip(190, 0.18, 'square', 0.14, 70);
        shake = Math.min(1, shake + 0.35);
        return;
    }
    shake = 1;
    slow = Math.max(slow, 0.1);
    blip(90, 0.45, 'sawtooth', 0.28, 40);
    buzz(70);
    for (let k = 0; k < 14; k++) {
        const a = rnd(0, 6.283), sp = rnd(180, 520);
        bits.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            r: rnd(2.5, 5), ang: a, spin: rnd(-16, 16), t: rnd(0.5, 1), boss: true });
    }
    for (const e of foes) {
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if (d > 95 || e.dead) continue;
        const f = 1 - d / 95;
        hurt(e, 40 * f, (e.x - b.x) / (d || 1) * 900 * f, (e.y - b.y) / (d || 1) * 900 * f);
    }
    if (Math.hypot(hero.x - b.x, hero.y - b.y) < 70 && hero.iframe <= 0 && !dead) {
        hero.iframe = 0.9; hero.hp -= 1;      // рядом с бочкой стоять нельзя
        if (hero.hp <= 0) { dead = 1.4; blip(70, 0.7, 'sawtooth', 0.25, 35); }
    }
}

function tickBarrels(dt) {
    for (const b of barrels) {
        const k = PROPS[b.kind];
        if (b.kind === 'яма') {
            for (const e of foes) {       // яма глотает сбитых и брошенных
                if (e.dead || (e.flying <= 0 && e.down <= 0)) continue;
                if (Math.hypot(e.x - b.x, e.y - b.y) < b.r) swallow(e);
            }
            continue;
        }
        if (b.dead) continue;

        // Твёрдое мешает ходить: враг обходит, а не проходит насквозь.
        if (k.solid) {
            for (const e of foes) {
                if (e.dead) continue;
                for (const q of e.p) {
                    const dx = q.x - b.x, dy = q.y - b.y;
                    const d = Math.hypot(dx, dy) || 1;
                    const over = b.r + e.r * 0.6 - d;
                    if (over > 0) { q.x += dx / d * over; q.y += dy / d * over; }
                }
                e.x = e.p[1].x; e.y = e.p[1].y;
            }
        }

        for (let i = 1; i < pts.length; i++) {
            const p = pts[i];
            if (!swept(p, { x: b.x, y: b.y, r: b.r }, radiusAt(i))) continue;
            const [vx, vy] = vel(p);
            if (Math.hypot(vx, vy) > 420 && --b.hp <= 0) { blowBarrel(b); }
            break;
        }
        if (b.dead) continue;
        for (const e of foes) {           // и брошенным телом тоже
            if (e.flying <= 0 || e.dead) continue;
            if (Math.hypot(e.x - b.x, e.y - b.y) < b.r + e.r) {
                hurt(e, 22, 0, 0);        // и телу достаётся
                if (--b.hp <= 0) blowBarrel(b);
                break;
            }
        }
    }
}

/* ─────────────────────────── Награда на бегу ──────────────────────────── */

/**
 * Ориентиры — Vampire Survivors и «огурчик»: там нет экранов между волнами,
 * награда капает под ноги и подбирается не останавливаясь. Поэтому карточки
 * прокачки заменены на то, что валяется на арене.
 */
function dropBoon(x, y, kind) {
    const idx = kind === 'оружие'
        ? Math.floor(rnd(0, WEAPONS.length))
        : Math.floor(rnd(0, UPGRADES.length));
    boons.push({ x, y, kind, idx, t: 26, bob: rnd(0, 6.283) });
}

function takeBoon(b) {
    taken++;
    if (b.kind === 'оружие') {
        const w = { ...WEAPONS[b.idx][2] };
        w.len0 = w.len;
        Object.assign(S, w);
        segNow = S.seg;
        while (pts.length > S.len) pts.pop();
        while (pts.length < S.len) {
            const t = pts[pts.length - 1];
            pts.push({ x: t.x, y: t.y, px: t.px, py: t.py });
        }
        nums.push({ x: b.x, y: b.y - 14, v: WEAPONS[b.idx][0], t: 1.4, big: true });
        blip(520, 0.2, 'square', 0.15, 900);
    } else {
        UPGRADES[b.idx][2]();
        nums.push({ x: b.x, y: b.y - 14, v: UPGRADES[b.idx][0], t: 1.4, big: true });
        blip(880, 0.14, 'sine', 0.12, 1400);
    }
    buzz(20);
}

/* ─────────────────────────── Испытание ────────────────────────────────── */

/**
 * Между волнами — одно физическое испытание: закинуть тело в ворота как
 * можно дальше. Ничего нового для него не понадобилось: захват, полёт и
 * тряпичные тела уже написаны, а мерить дальность умеет любая физика.
 */
function startTrial() {
    paused = false;
    hooked = null;
    foes = []; orbs = []; bits = [];
    const k = KINDS['ходок'];
    const x = W * 0.28, y = H * 0.62;
    foes.push({
        x, y, kind: 'ходок', boss: false, hp: 99999, hp0: 99999,
        r: k.r, link: k.link, walk: 0, damp: k.damp, mass: 0.7, armor: 0,
        color: k.color, dark: k.dark, chain: 0, step: 0, down: 0,
        iframe: 0, flash: 0, squeeze: 0, touch: 0, held: false, flying: 0,
        p: body(x, y, k.link),
    });
    hero.x = W * 0.22; hero.y = H * 0.72;
    hero.hp = hero.hpMax;
    trial = {
        goalY: H * 0.18, half: W * 0.22,
        from: null, best: 0, t: 26, done: 0,
    };
    blip(660, 0.12, 'sine', 0.1); blip(880, 0.18, 'sine', 0.08);
}

function tickTrial(dt) {
    const e = foes[0];
    if (!e) { endTrial(); return; }
    trial.t -= dt;

    // Началом броска считаем место, откуда тело отпустили.
    if (e.flying > 0 && !trial.from) trial.from = { x: e.x, y: e.y };
    if (trial.from) {
        const d = Math.hypot(e.x - trial.from.x, e.y - trial.from.y);
        trial.best = Math.max(trial.best, d);
        const q = e.p[1];
        const still = Math.hypot(q.x - q.px, q.y - q.py) / DT < 40;
        trial.done = still ? trial.done + dt : 0;
        if (trial.done > 0.6) { endTrial(); return; }
    }
    if (trial.t <= 0) endTrial();
}

function endTrial() {
    const e = foes[0];
    const meters = trial.best / METER;
    // Ворота — створ у дальнего края: пролетел между стойками, значит вдвое.
    const scored = e && e.y < trial.goalY + 30 && Math.abs(e.x - W / 2) < trial.half;
    const pts_ = Math.round(meters * (scored ? 40 : 20));
    score += pts_;
    nums.push({ x: W / 2, y: H * 0.34, v: (scored ? 'в ворота! ' : '') + meters.toFixed(1) + ' м', t: 2.2, big: true });
    blip(scored ? 720 : 400, 0.3, 'square', 0.14, scored ? 1200 : 220);
    trial = null; trials++;
    foes = [];
    offerCards();
}

/* ─────────────────────────── Прокачка забега ───────────────────────────── */

/**
 * Прокачка меняет физику, а не цифру в табличке: длину рычага, вес
 * наконечника, скорость руки. Поэтому её видно и слышно в замахе.
 */
const UPGRADES = [
    ['Длиннее', '+2 звена: дальше достаёшь и больнее бьёшь, но хуже поворачиваешь', () => grow(2), 'longer'],
    ['Тяжёлый наконечник', 'оружие сильнее таскает тело за собой', () => { S.tipWeight = Math.min(0.6, S.tipWeight + 0.08); }, 'weight'],
    ['Рывок', '+150 к скорости руки', () => { S.headSpeed += 150; }, 'dash'],
    ['Шипы', 'больнее бьёт всё тело, а не только кончик', () => { S.bodyMul += 0.4; }, 'spikes'],
    ['Заточка', 'больнее бьёт наконечник', () => { S.bladeMul += 0.5; }, 'sharpen'],
    ['Скользкое тело', 'тело дольше держит разгон', () => { S.drag = Math.min(0.998, S.drag + 0.002); }, 'slick'],
];

function offerCards() {
    paused = true;
    score += 40 * wave;                 // за пройденную волну
    const pool = UPGRADES.slice(), pick = [];
    while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.floor(rnd(0, pool.length)), 1)[0]);
    const el = $('cards');
    el.innerHTML = '<h2>Волна ' + wave + ' зачищена</h2>' +
        pick.map((u, i) => '<button data-u="' + i + '" aria-label="' + u[0] + '">' +
            '<span class="ic">' + (ICON[u[3]] || '') + '</span>' +
            '<span class="tx"><b>' + u[0] + '</b><span>' + u[1] + '</span></span></button>').join('');
    el.classList.add('on');
    el.onclick = (ev) => {
        const b = ev.target.closest('button');
        if (!b) return;
        pick[+b.dataset.u][2]();
        startWave();
    };
}

/* ──────────────────────────────── Отрисовка ────────────────────────────── */

/**
 * Спрайты нарисованы развёрнутыми вверх, а кости считает физика. Поэтому
 * поворот — это направление кости плюс четверть оборота.
 */
function drawImg(im, x, y, size, ang) {
    const w = im.naturalWidth || 1, h = im.naturalHeight || 1;
    const k = size / Math.max(w, h);
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.drawImage(im, -w * k / 2, -h * k / 2, w * k, h * k);
    ctx.restore();
}

/** Рисует спрайт в масштабе `k` от собственного размера. */
function drawPart(im, x, y, k, ang) {
    const w = im.naturalWidth * k, h = im.naturalHeight * k;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.drawImage(im, -w / 2, -h / 2, w, h);
    ctx.restore();
}

/** Членистое тело: голова, повторяющиеся кольца, хвост. */
function drawWormSprite(e) {
    const head = SPR['boss-worm-head'], link = SPR['boss-worm-link'], tail = SPR['boss-worm-tail'];
    if (!ready(head) || !ready(link)) return false;
    const k = (e.r * 2.4) / link.naturalWidth;
    const n = e.p.length;
    for (let i = n - 1; i >= 1; i--) {          // от хвоста к голове: голова должна быть сверху
        const im = (i === n - 1 && ready(tail)) ? tail : link;
        drawPart(im, e.p[i].x, e.p[i].y, k, boneAng(e.p[i], e.p[i - 1]));
    }
    drawPart(head, e.p[0].x, e.p[0].y, k, boneAng(e.p[1], e.p[0]));
    if (e.flash > 0) {
        ctx.globalAlpha = e.flash * 0.7; ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(e.p[0].x, e.p[0].y, e.r * 1.2, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
    }
    const bw = 70, h = e.p[0];
    ctx.fillStyle = '#1e2833'; ctx.fillRect(h.x - bw / 2, h.y - e.r - 26, bw, 5);
    ctx.fillStyle = '#c2566b';
    ctx.fillRect(h.x - bw / 2, h.y - e.r - 26, bw * Math.max(0, e.hp / e.hp0), 5);
    return true;
}

/** Спрайт смотрит вверх, кость идёт от a к b — отсюда поворот. */
const boneAng = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;

const KIND_SPR = {
    'ходок': 'foe-walker', 'бегун': 'foe-runner', 'толстяк': 'foe-fat',
    'щитоносец': 'foe-shield', 'туша': 'boss-hulk',
    'ползун': 'foe-crawler', 'прыгун': 'foe-jumper', 'верзила': 'foe-brute',
    'колючий': 'foe-spike', 'оболочка': 'foe-husk',
};

/**
 * Тело врага собирается из трёх частей на трёх точках симуляции. Масштаб
 * берётся от туловища, чтобы пропорции остались теми, что нарисованы.
 */
function drawFoeSprite(e) {
    if (e.chain) return drawWormSprite(e);
    const pre = KIND_SPR[e.kind];
    const torso = SPR[pre + '-torso'];
    if (!pre || !ready(torso)) return false;
    const lying = e.down > 0;
    // Лежачий вжат в землю и отброшен тенью: видно, что он не в строю.
    const k = (e.r * 2.3) / torso.naturalWidth * (lying ? 0.8 : 1);
    if (lying) {
        ctx.fillStyle = 'rgba(0,0,0,.4)';
        for (const q of e.p) {
            ctx.beginPath(); ctx.ellipse(q.x, q.y + 3, e.r * 0.9, e.r * 0.45, 0, 0, 7); ctx.fill();
        }
    }
    const legs = SPR[pre + '-legs'], head = SPR[pre + '-head'];
    // Фаза шага крутится от пройденного пути, поэтому стоящий не сучит ногами.
    const gait = lying ? 0 : Math.sin(e.step * 5.5) * 0.34;
    if (ready(legs)) drawPart(legs, e.p[2].x, e.p[2].y, k, boneAng(e.p[2], e.p[1]) + gait);
    drawPart(torso, e.p[1].x, e.p[1].y, k, boneAng(e.p[2], e.p[0]) - gait * 0.25);
    if (ready(head)) drawPart(head, e.p[0].x, e.p[0].y, k, boneAng(e.p[1], e.p[0]));

    const extra = e.boss ? SPR['boss-hulk-plates'] : (e.kind === 'щитоносец' ? SPR['foe-shield-shield'] : null);
    if (ready(extra)) {
        const side = e.kind === 'щитоносец' ? e.r * 0.8 : 0;
        const a = boneAng(e.p[2], e.p[0]);
        drawPart(extra, e.p[1].x + Math.cos(a) * side, e.p[1].y + Math.sin(a) * side, k, a);
    }

    if (e.flash > 0) {                        // спрайт не перекрасить — белим поверх
        ctx.globalAlpha = e.flash * 0.75;
        ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = e.r * 1.3;
        ctx.beginPath();
        ctx.moveTo(e.p[2].x, e.p[2].y);
        ctx.lineTo(e.p[1].x, e.p[1].y);
        ctx.lineTo(e.p[0].x, e.p[0].y);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
    return true;
}

/**
 * Стена слева и ворота в ней. Здоровье ворот показано трещинами и креном
 * створки, а не числом: цифру в углу не замечают, а расходящуюся щель видно
 * боковым зрением, не отрываясь от боя.
 */
function drawWall() {
    const k = gate.hp / gate.hp0;                 // 1 целые, 0 пали
    const t0 = gateTop(), t1 = gateBot();

    ctx.fillStyle = '#3a3f46';                    // кладка
    ctx.fillRect(0, 0, WALL, H);
    ctx.fillStyle = '#2b2f35';
    for (let y = 0; y < H; y += 26) {
        ctx.fillRect(0, y + ((y / 26) % 2 ? 0 : 13), WALL, 2);
    }
    ctx.fillStyle = '#4a5058';
    ctx.fillRect(WALL - 4, 0, 4, H);              // кромка, по ней читается край

    // Проём: створки. Целые сходятся посередине, битые расходятся.
    const gap = (1 - k) * 26;
    ctx.fillStyle = '#141719';
    ctx.fillRect(0, t0, WALL, t1 - t0);
    const leaf = (y0, y1, dir) => {
        ctx.save();
        ctx.translate(WALL / 2, dir > 0 ? y1 : y0);
        ctx.rotate(dir * gap * 0.006);
        const h = (y1 - y0) - gap / 2;
        ctx.fillStyle = gate.hit > 0 ? '#8a5c3a' : '#6b4a2f';
        ctx.fillRect(-WALL / 2 + 2, dir > 0 ? -h : 0, WALL - 4, h);
        ctx.fillStyle = '#503722';
        for (let i = 1; i < 4; i++) {
            const yy = (dir > 0 ? -h : 0) + h * i / 4;
            ctx.fillRect(-WALL / 2 + 2, yy, WALL - 4, 1.5);
        }
        ctx.fillStyle = '#8d949c';                // оковка
        ctx.fillRect(-WALL / 2 + 2, (dir > 0 ? -h : 0) + h * 0.28, WALL - 4, 3);
        ctx.restore();
    };
    leaf(t0, (t0 + t1) / 2, -1);
    leaf((t0 + t1) / 2, t1, 1);

    // Трещины: их число растёт с уроном, поэтому «сколько осталось» видно
    // не приглядываясь.
    const cracks = Math.round((1 - k) * 9);
    ctx.strokeStyle = 'rgba(20,16,14,.85)'; ctx.lineWidth = 1.6;
    for (let i = 0; i < cracks; i++) {
        const y = t0 + ((i * 37) % (t1 - t0));
        ctx.beginPath();
        ctx.moveTo(3, y);
        ctx.lineTo(WALL - 3, y + (i % 2 ? 11 : -11));
        ctx.stroke();
    }
    if (gate.hit > 0) {                            // вспышка удара
        ctx.fillStyle = 'rgba(255,120,80,' + (gate.hit * 0.35).toFixed(3) + ')';
        ctx.fillRect(0, t0, WALL, t1 - t0);
    }
    if (gate.hp <= 0) {
        ctx.fillStyle = 'rgba(0,0,0,.75)';
        ctx.fillRect(0, t0, WALL, t1 - t0);
    }

    // Кто лезет через стену — и сколько ему осталось.
    for (const e of foes) {
        if (!e.climb) continue;
        const p = e.climb / CLIMB;
        ctx.strokeStyle = 'rgba(255,190,90,.9)'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(WALL - 2, e.y + 12);
        ctx.lineTo(WALL - 2, e.y + 12 - 24 * p);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,190,90,.85)';
        ctx.beginPath(); ctx.arc(WALL - 2, e.y + 12 - 24 * p, 3, 0, 7); ctx.fill();
    }
}

/** Одна арена: небо и плитка. Вынесено, чтобы их можно было наложить две. */
function paintBiome(b, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = b.sky;
    ctx.fillRect(-8, -8, W + 16, H + 16);
    // Плитка 512 точек кладётся на 256 единиц мира: рисунок в ней крупный,
    // и мельчить его нельзя — по нему считывается перемещение.
    const im = groundTile[b.tile];
    if (im && im.complete && im.naturalWidth) {
        if (!b.pat) b.pat = ctx.createPattern(im, 'repeat');
        ctx.save();
        ctx.scale(0.5, 0.5);
        ctx.fillStyle = b.pat;
        ctx.fillRect(-16, -16, (W + 32) * 2, (H + 32) * 2);
        ctx.restore();
    }
    ctx.globalAlpha = 1;
    return !!(im && im.complete && im.naturalWidth);
}

function drawGround() {
    const b = biome();
    // Арена сменяется переходом, а не подменой кадра: «фигак, и задник
    // сменился» — первое, что назвал владелец. Полторы секунды наплыва
    // стоят одной переменной и убирают весь рывок.
    const idx = biomeIdx();
    if (biomeShown < 0) { biomeShown = idx; biomeWas = idx; }   // до первого шага
    if (decoFor !== idx || !deco.length) buildDeco();

    let drawn = true;
    if (biomeFade < 1) {
        paintBiome(BIOMES[biomeWas], 1);
        drawn = paintBiome(b, biomeFade);
    } else {
        drawn = paintBiome(b, 1);
    }
    if (!drawn) {                                   // пока не загрузилась — сетка
        const step = b.style === 'плиты' ? 74 : 44;   // пока плитка не доехала
        ctx.strokeStyle = b.line; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
        for (let y = 0; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
        ctx.stroke();
    }

    for (const d of deco) {
        if (b.style === 'камни') {
            ctx.fillStyle = d.t > 0.7 ? b.mark : b.spot;
            ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.68, d.a, 0, 7); ctx.fill();
        } else if (b.style === 'трещины') {
            ctx.strokeStyle = b.mark; ctx.lineWidth = 0.8 + d.t;
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x + Math.cos(d.a) * d.l, d.y + Math.sin(d.a) * d.l);
            ctx.lineTo(d.x + Math.cos(d.a + 0.7) * d.l * 1.6, d.y + Math.sin(d.a + 0.7) * d.l * 1.6);
            ctx.stroke();
        } else if (b.style === 'плиты') {
            if (d.t > 0.84) {                       // угли в чертоге дышат
                // Мельче и глуше, чем враг: реквизит не должен путаться с живым.
                ctx.fillStyle = 'rgba(214,122,48,' + (0.10 + 0.08 * Math.sin(frame * 0.05 + d.a * 7)) + ')';
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.75, 0, 7); ctx.fill();
            } else {
                ctx.fillStyle = b.spot;
                ctx.fillRect(d.x, d.y, d.r * 2.4, d.r * 1.6);
            }
        } else {
            ctx.fillStyle = d.t > 0.6 ? b.mark : b.spot;
            ctx.fillRect(d.x, d.y, d.r * 0.8, d.r * 0.8);
        }
    }

    if (dec) ctx.drawImage(dec, 0, 0, W, H);      // следы боя поверх земли

    ctx.strokeStyle = b.mark; ctx.lineWidth = 2;
    ctx.strokeRect(PAD, PAD, W - PAD * 2, H - PAD * 2);
}

function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-2.5, 2.5) * shake, rnd(-2.5, 2.5) * shake);

    drawGround();
    // Где сейчас заходят: расходящееся кольцо на кромке. Оно живёт секунду и
    // гаснет — этого хватает, чтобы приход читался как приход.
    drawWall();
    for (const m of marks) {
        const k = 1 - m.t / 1.1;
        ctx.strokeStyle = 'rgba(226,120,120,' + (m.t * 0.5).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(m.x, m.y, 6 + k * 26, 0, 7); ctx.stroke();
    }

    if (trial) {
        const y = trial.goalY, hw = trial.half;
        ctx.strokeStyle = 'rgba(255,214,110,.55)'; ctx.lineWidth = 3;
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(W / 2 - hw, y); ctx.lineTo(W / 2 + hw, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineWidth = 7; ctx.strokeStyle = '#e0b64a';
        for (const sx of [W / 2 - hw, W / 2 + hw]) {
            ctx.beginPath(); ctx.moveTo(sx, y - 26); ctx.lineTo(sx, y + 26); ctx.stroke();
        }
        ctx.fillStyle = '#9fb0c2'; ctx.textAlign = 'center';
        ctx.font = '600 15px ui-sans-serif, sans-serif';
        ctx.fillText('зацепи и закинь в ворота', W / 2, H * 0.30);
        ctx.font = '700 22px ui-sans-serif, sans-serif'; ctx.fillStyle = '#e8eef5';
        ctx.fillText((trial.best / METER).toFixed(1) + ' м', W / 2, H * 0.35);
    }

    if (gripped && !gripped.dead) {
        const t = pts[pts.length - 1];
        ctx.strokeStyle = 'rgba(255,120,120,.75)'; ctx.lineWidth = 3;
        ctx.setLineDash([6, 5]);
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(gripped.x, gripped.y); ctx.stroke();
        ctx.setLineDash([]);
    }

    if (hooked && !hooked.dead) {
        const t = pts[pts.length - 1];
        ctx.strokeStyle = 'rgba(120,255,190,.55)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(hooked.x, hooked.y); ctx.stroke();
    }

    for (const b of barrels) {
        if (b.kind === 'яма') {
            ctx.fillStyle = '#05070a';
            ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.r * 0.72, 0, 0, 7); ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r + 2, b.r * 0.72 + 2, 0, 0, 7); ctx.stroke();
            continue;
        }
        const base = PROPS[b.kind].spr;
        const im = SPR[b.dead ? base + '-broken' : base];
        if (ready(im)) drawPart(im, b.x, b.y, (b.r * 2.4) / im.naturalWidth, 0);
    }

    for (const b of boons) {
        const im = SPR[b.kind === 'оружие' ? 'item-chest-closed' : 'item-rune'];
        const y = b.y + Math.sin(frame * 0.06 + b.bob) * 3;
        ctx.strokeStyle = b.kind === 'оружие' ? 'rgba(255,214,110,.8)' : 'rgba(140,230,255,.8)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b.x, y, 16, 0, 7); ctx.stroke();
        if (ready(im)) drawPart(im, b.x, y, 26 / im.naturalWidth, 0);
    }

    for (const o of orbs) {
        if (ready(SPR['pickup-soul'])) {
            drawImg(SPR['pickup-soul'], o.x, o.y, 13, Math.sin(frame * 0.06 + o.x) * 0.25);
        } else {
            ctx.fillStyle = '#8ef2b0';
            ctx.beginPath(); ctx.arc(o.x, o.y, 4.5, 0, 7); ctx.fill();
        }
    }

    if (S.rock) {
        if (ready(SPR['prop-rock'])) {
            drawImg(SPR['prop-rock'], rock.x, rock.y, rock.r * 2.2, rock.x * 0.01);
        } else {
            ctx.fillStyle = '#6b6f77';
            ctx.beginPath(); ctx.arc(rock.x, rock.y, rock.r, 0, 7); ctx.fill();
        }
    }

    for (const b of bits) {
        if (b.wet) {                       // капля: мазок по направлению полёта
            const sp = Math.hypot(b.vx, b.vy);
            ctx.strokeStyle = b.wet;
            ctx.globalAlpha = Math.min(1, b.t * 3);
            ctx.lineWidth = b.r * 1.6; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            // Длина мазка привязана к размеру капли, а не к общему потолку:
            // иначе мелкая капля рисуется такой же палкой, как крупная, и
            // веер из девяноста читается конфетти, а не брызгами.
            const sm = Math.min(b.r * 4.5, sp * 0.03);
            ctx.lineTo(b.x - b.vx / sp * sm, b.y - b.vy / sp * sm);
            ctx.stroke();
            ctx.globalAlpha = 1;
            continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.min(1, b.t * 2);
        ctx.translate(b.x, b.y); ctx.rotate(b.ang);
        ctx.fillStyle = b.boss ? '#6c7684' : '#a8455a';
        ctx.fillRect(-b.r, -b.r * 0.75, b.r * 2, b.r * 1.5);
        ctx.fillStyle = b.boss ? '#8d97a5' : '#c2566b';
        ctx.fillRect(-b.r, -b.r * 0.75, b.r * 2, b.r * 0.7);
        if (b.grab && !held) {
            ctx.strokeStyle = 'rgba(255,214,110,.8)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(0, 0, b.r + 5, 0, 7); ctx.stroke();
        }
        ctx.restore();
    }
    ctx.globalAlpha = 1;

    for (const e of foes) {
        if (e.held || e.flying > 0) {
            ctx.strokeStyle = e.held ? 'rgba(120,255,190,.8)' : 'rgba(255,214,110,.75)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.5, 0, 7); ctx.stroke();
        }
        if (drawFoeSprite(e)) continue;
        const r = e.r * (1 - e.squeeze * 0.3);
        const white = e.flash > 0;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = white ? '#ffffff' : e.dark;
        ctx.lineWidth = r * 1.45;
        ctx.beginPath();
        ctx.moveTo(e.p[2].x, e.p[2].y);
        ctx.lineTo(e.p[1].x, e.p[1].y);
        ctx.lineTo(e.p[0].x, e.p[0].y);
        ctx.stroke();
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath(); ctx.arc(e.p[0].x, e.p[0].y, r * 0.92, 0, 7); ctx.fill();
        const ex = e.p[0].x - e.p[1].x, ey = e.p[0].y - e.p[1].y;
        const ed = Math.hypot(ex, ey) || 1;
        const nx = -ey / ed * r * 0.34, ny = ex / ed * r * 0.34;
        ctx.fillStyle = '#1b1016';
        ctx.beginPath();
        ctx.arc(e.p[0].x + nx, e.p[0].y + ny, r * 0.17, 0, 7);
        ctx.arc(e.p[0].x - nx, e.p[0].y - ny, r * 0.17, 0, 7);
        ctx.fill();
        if (e.boss) {
            ctx.strokeStyle = '#8d97a5'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(e.p[1].x, e.p[1].y, r * 0.75, 0.6, 2.6); ctx.stroke();
            const bw = 70;
            ctx.fillStyle = '#1e2833'; ctx.fillRect(e.x - bw / 2, e.y - r - 26, bw, 5);
            ctx.fillStyle = '#c2566b';
            ctx.fillRect(e.x - bw / 2, e.y - r - 26, bw * Math.max(0, e.hp / e.hp0), 5);
        }
    }

    // Смаз замаха — одна залитая лента между следом кончика и следом основания.
    // Копии кадров на быстром замахе разъезжались в частокол; лента не рвётся.
    const tipNow = pts[pts.length - 1];
    const [tvx0, tvy0] = vel(tipNow);
    // Лента — это прибор: она загорается ровно тогда, когда замах уже бьёт.
    const hot = Math.min(1, Math.max(0, (effSpeed(tvx0, tvy0) - hitFloor()) / 900));
    if (trail.length > 2 && hot > 0.02) {
        ctx.beginPath();
        ctx.moveTo(trail[0][0], trail[0][1]);
        for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i][0], trail[i][1]);
        for (let i = trail.length - 1; i >= 0; i--) ctx.lineTo(trail[i][2], trail[i][3]);
        ctx.closePath();
        const cc = S.bladeRGB;
        ctx.fillStyle = 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + (0.05 + 0.2 * hot) + ')';
        ctx.fill();
    }

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = S.haftDark; ctx.lineWidth = 13; ctx.stroke();
    ctx.strokeStyle = S.haft; ctx.lineWidth = 8.5; ctx.stroke();

    ctx.beginPath(); ctx.moveTo(pts[pts.length - BLADE - 1].x, pts[pts.length - BLADE - 1].y);
    for (let i = pts.length - BLADE; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    const c = S.bladeRGB;
    const blade = SPR['weapon-' + S.sprite + '-blade'] || SPR['weapon-' + S.sprite + '-head'];
    if (ready(blade)) {
        const a = pts[pts.length - 1], b = pts[Math.max(0, pts.length - 2)];
        const ang = Math.atan2(a.y - b.y, a.x - b.x) + Math.PI / 2;
        if (hot > 0.05) {                      // разогнанное оружие светится
            ctx.fillStyle = 'rgba(255,' + Math.round(200 - 80 * hot) + ',120,' + (0.25 * hot) + ')';
            ctx.beginPath(); ctx.arc(a.x, a.y, S.bladeW * (1 + hot), 0, 7); ctx.fill();
        }
        drawImg(blade, a.x, a.y, S.bladeW * 2.4, ang);
    } else {
        ctx.strokeStyle = 'rgb(' + Math.round(c[0] + (255 - c[0]) * hot) + ',' +
            Math.round(c[1] * (1 - 0.32 * hot)) + ',' + Math.round(c[2] * (1 - 0.5 * hot)) + ')';
        ctx.lineWidth = S.bladeW; ctx.stroke();
    }

    if (held) {                       // подобранный кусок висит на конце
        const t = pts[pts.length - 1];
        ctx.fillStyle = held.boss ? '#8d97a5' : '#c2566b';
        ctx.beginPath(); ctx.arc(t.x, t.y, held.r, 0, 7); ctx.fill();
        ctx.fillStyle = '#11161c';
        ctx.font = '700 9px ui-sans-serif, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(held.hits, t.x, t.y + 3.5);
    }

    // Герой: тень, туловище, шлем, вытянутая к оружию рука и сердца над головой.
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(hero.x, hero.y + 10, 10, 4, 0, 0, 7); ctx.fill();
    const blink = hero.iframe > 0 && (frame & 4);
    ctx.strokeStyle = blink ? '#ffffff' : '#d8c39c';
    ctx.lineCap = 'round'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(hero.x, hero.y); ctx.lineTo(pts[0].x, pts[0].y); ctx.stroke();
    const hx = hero.x + hero.fx * 2, hy = hero.y - 6 + hero.fy * 2;
    const body = SPR['hero-body'];
    if (ready(body)) {
        const k = (HERO_R * 2.4) / body.naturalWidth;
        const face = Math.atan2(hero.fy, hero.fx) + Math.PI / 2;
        drawPart(body, hero.x, hero.y + 1, k, face);
        if (ready(SPR['hero-head'])) drawPart(SPR['hero-head'], hx, hy, k, face);
        const hand = SPR['hero-hand'];   // у кисти свой масштаб: в общем она с голову
        if (ready(hand)) drawPart(hand, pts[0].x, pts[0].y, 9 / hand.naturalWidth, face);
        if (blink) {
            ctx.globalAlpha = 0.6; ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(hero.x, hero.y, HERO_R, 0, 7); ctx.fill();
            ctx.globalAlpha = 1;
        }
    } else {
        ctx.fillStyle = blink ? '#ffffff' : '#7d5f3d';
        ctx.strokeStyle = '#0d1014'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(hero.x, hero.y + 2, 10, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = blink ? '#ffffff' : '#d8c39c';
        ctx.beginPath(); ctx.arc(hx, hy, 6.5, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#98a2ad';
        ctx.beginPath(); ctx.arc(hx, hy, 6.4, Math.PI, 0); ctx.fill();
    }
    for (let i = 0; i < hero.hpMax; i++) {
        ctx.fillStyle = i < hero.hp ? '#e0556d' : '#3a2530';
        ctx.fillRect(hero.x - hero.hpMax * 4 + i * 8, hero.y - 24, 6, 5);
    }

    const dp = pts[driver()];
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(dp.x, dp.y, 17, 0, 7); ctx.stroke();

    for (const n of nums) {
        ctx.globalAlpha = Math.min(1, n.t * 2.5);
        ctx.fillStyle = n.big ? '#ffd873' : '#ffffff';
        ctx.font = (n.big ? '700 20px ' : '600 14px ') + 'ui-sans-serif, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(n.v, n.x, n.y);
        ctx.globalAlpha = 1;
    }

    if (dead > 0) {
        ctx.fillStyle = 'rgba(10,12,16,.72)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#e8eef5'; ctx.font = '600 22px ui-sans-serif, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Викинг пал.', W / 2, H / 2);
    }
    ctx.restore();
}

/* ──────────────────────────────── Цикл ─────────────────────────────────── */

let acc = 0, last = performance.now(), frame = 0;

function loop(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (slow > 0) { slow = Math.max(0, slow - dt); dt *= 0.3; }   // добивание видно
    // При съёмке физику двигает снимающий, а рисовать надо по-прежнему:
    // холст очищается при любом изменении размера, и перерисовать его иначе
    // будет некому.
    if (filming) { /* шаги делает window.naotmash.step */ }
    else if (dead > 0) { dead -= dt; if (dead <= 0) showResult(); }
    else if (!paused && !menu && started) {
        acc += dt;
        let n = 0;
        while (acc >= DT && n++ < 6) { step(DT); acc -= DT; }
    }

    const tip = pts[pts.length - 1], base = pts[Math.max(0, pts.length - BLADE - 1)];
    trail.push([tip.x, tip.y, base.x, base.y]);
    if (trail.length > 9) trail.shift();

    draw();
    hum(Math.hypot(...vel(pts[pts.length - 1])));
    if ((frame++ & 3) === 0) ui();
    requestAnimationFrame(loop);
}

/* ─────────────────────────────── Интерфейс ─────────────────────────────── */

const $ = (id) => document.getElementById(id);

function ui() {
    const [vx, vy] = vel(pts[pts.length - 1]);
    const sp = Math.round(Math.hypot(vx, vy));
    let mx = 0;
    for (const p of pts) mx = Math.max(mx, Math.hypot(...vel(p)));
    $('mx').textContent = Math.round(mx);
    $('wv').textContent = wave;
    $('sc').textContent = score;
    $('th').textContent = !theme ? ''
        : wave % 5 === 0 ? ((wave / 5) % 2 === 0 ? '· червь' : '· туша')
        : '· ' + theme[0];
    $('sp').textContent = sp;
    const f = Math.min(1, sp / 2500);
    $('speedfill').style.width = (f * 100) + '%';
    $('speedfill').style.background = sp > HIT_SPEED ? '#e0b64a' : '#35506b';
    $('ln').textContent = pts.length + (held ? ' + кусок' : '');
    $('best').textContent = Math.round(best);
    $('v-len').textContent = pts.length;
    $('v-tip').textContent = Math.round(S.tipWeight * 100);
    $('v-spd').textContent = S.headSpeed;
    $('v-hand').textContent = S.hand;
    $('v-bend').textContent = S.bend;
    $('snd').innerHTML = S.sound ? (ICON['sound-on'] || 'вкл') : (ICON['sound-off'] || 'выкл');
}

document.getElementById('panel').addEventListener('click', (ev) => {
    const a = ev.target.dataset.a;
    if (!a) return;
    if (a === 'len+') grow(2);
    if (a === 'len-') shrink(2);
    if (a === 'tip+') S.tipWeight = Math.min(0.6, S.tipWeight + 0.05);
    if (a === 'tip-') S.tipWeight = Math.max(0, S.tipWeight - 0.05);
    if (a === 'spd+') S.headSpeed = Math.min(2400, S.headSpeed + 150);
    if (a === 'spd-') S.headSpeed = Math.max(300, S.headSpeed - 150);
    if (a === 'rock') { S.rock = !S.rock; ev.target.classList.toggle('on', S.rock); }
    if (a === 'foes') { S.foes = !S.foes; ev.target.classList.toggle('on', S.foes); if (!S.foes) foes = []; }
    if (a === 'bend+') S.bend = Math.min(9, S.bend + 1);
    if (a === 'bend-') S.bend = Math.max(0, S.bend - 1);
    if (a === 'sound') { S.sound = !S.sound; ev.target.classList.toggle('on', S.sound); if (S.sound) audioOn(); else hum(0); }
    if (a === 'hand+') S.hand = Math.min(9, S.hand + 1);
    if (a === 'hand-') S.hand = Math.max(1, S.hand - 1);
    if (a === 'reset') reset();
    if (a === 'len+' || a === 'len-') BASE.len = pts.length;
    BASE.tipWeight = S.tipWeight; BASE.headSpeed = S.headSpeed;
    BASE.mode = S.mode; BASE.rock = S.rock; BASE.foes = S.foes; BASE.hand = S.hand; BASE.bend = S.bend; BASE.sound = S.sound;
    ui();
});

// На тачскрине палец грубее мыши, а экран уже: и умолчания, и панель тут другие.
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) { S.hand = 7; BASE.hand = 7; }
$('panel').classList.add('off');          // это отладка, а не часть игры
try { record = parseInt(localStorage.getItem('worm-record'), 10) || 0; } catch { record = 0; }
showStart();

// Открытая панель — это и есть пауза: крутить ползунки в бою невозможно.
const gearFace = () => { $('gear').innerHTML = menu ? '▶' : (ICON.gear || '⚙'); };
gearFace();
$('gear').addEventListener('click', () => {
    menu = !$('panel').classList.toggle('off');
    $('gauges').classList.toggle('on', menu);   // линейки живут рядом с ползунками
    gearFace();
});

$('over').addEventListener('click', (ev) => {
    if (!ev.target.closest('button')) return;
    $('over').classList.remove('on');
    reset();
    showStart();
});

// Кнопка «на главную» висит над полем, а игра водится пальцем по всему
// экрану: один замах в угол — и партия кончилась молча. Это уже стоило
// владельцу прогресса в другой игре, поэтому начатую партию спрашиваем.
document.querySelector('.game-home-menu').addEventListener('click', (ev) => {
    if (!started || dead > 0 || menu) return;      // партия не идёт — уходим сразу
    if (!confirm('Точно выйти? Партия и счёт потеряются.')) ev.preventDefault();
});

$('start').addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    const w = { ...WEAPONS[+b.dataset.w][2] };
    w.len0 = w.len;
    Object.assign(S, w); Object.assign(BASE, w);   // выбор переживает смерть
    reset();
    $('start').classList.remove('on');
    started = true;
    audioOn();                            // настоящее касание: звук заводится сразу
    if (ac && ac.state !== 'running') ac.resume?.();
});

// Палец закрывает собой то, чем машешь, поэтому на тачскрине рука идёт выше него.
const LIFT = coarse ? 30 : 0;
let primary = null;
const setAim = (e) => { aim.x = e.clientX / sc; aim.y = e.clientY / sc - LIFT; };

cv.addEventListener('pointerdown', (e) => {
    if (primary !== null) {                          // второй палец — напрячь
        if (!tense) play('натяг', 0.4, 1);
        tense = true;
        return;
    }
    primary = e.pointerId;
    aim.down = true; setAim(e); audioOn();
    if (ac && ac.state !== 'running') ac.resume?.();
    try { cv.setPointerCapture(e.pointerId); } catch { /* синтетические события */ }
});
cv.addEventListener('pointermove', (e) => { if (aim.down && e.pointerId === primary) setAim(e); });
const release = (e) => {
    if (e.pointerId === primary) { primary = null; aim.down = false; } else tense = false;
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('keydown', (e) => {
    if (e.key !== 'Shift' || tense) return;
    tense = true; play('натяг', 0.4, 1);
});
addEventListener('keyup', (e) => { if (e.key === 'Shift') tense = false; });

function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const wasEmpty = W === 0 || H === 0;
    const cw = cv.clientWidth, ch = cv.clientHeight;
    if (!cw || !ch) return;
    sc = Math.min(cw, ch) / VIEW;
    W = cw / sc; H = ch / sc;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
    buildDec(); buildDeco();
    // Первый раз реальный размер приходит уже после запуска — расставляем заново.
    if (wasEmpty) reset();
}
new ResizeObserver(resize).observe(cv);

resize(); if (!pts.length) reset(); ui();
requestAnimationFrame(loop);

/*
 * Самопроверка: worm.html?test прокручивает бой синхронно, без рук и без
 * анимации, и печатает итог в консоль. Нужна потому, что проверять сборку
 * приходится на чужом телефоне, а ошибка боя проявляется только в бою.
 */
/*
 * Снаряд для витрины: игра сама ставит сцену, снимает её кто-то другой.
 * Всё детерминировано — сид фиксирован, разгон отсчитан подшагами, жертва
 * ставится ровно на пути кончика. Иначе яркий кадр пришлось бы ловить
 * десятками дублей.
 */
const physStep = step;
let filming = false;
window.naotmash = {
    /** Остановить собственный цикл игры: дальше кадры двигает снимающий. */
    hold() { filming = true; return this; },
    release() { filming = false; last = performance.now(); return this; },
    /** Ставит сцену. 'удар' — разогнанный цеп встречает врага в упор. */
    scene(opts) {
        const o = opts || {};
        filming = true;
        srand(o.seed || 20260830);
        const w = { ...WEAPONS[o.weapon || 0][2] };
        w.len0 = w.len;
        Object.assign(S, w); Object.assign(BASE, w);
        resize();
        if (!W || !H) { W = 450; H = 900; sc = 1; ctx.setTransform(1, 0, 0, 1, 0, 0); }
        reset();
        started = true; paused = false; menu = false; trial = null;
        $('start').classList.remove('on');
        $('over').classList.remove('on');
        foes = []; boons = []; barrels = []; bits = []; nums = []; orbs = []; spawnLeft = 0;
        hero.x = W / 2; hero.y = H * (o.hy || 0.60);
        aim.down = true;
        filmSpin = o.spin || 9; filmR = o.radius || 92;
        for (let i = 0; i < 130; i++) {          // разгон вхолостую
            const t = i / 120;
            aim.x = hero.x + Math.cos(t * filmSpin) * filmR;
            aim.y = hero.y + Math.sin(t * filmSpin) * filmR;
            physStep(1 / 120);
        }
        // Жертву ставим ровно туда, куда сейчас летит кончик.
        const tip = pts[pts.length - 1];
        const [vx, vy] = vel(tip);
        const d = Math.hypot(vx, vy) || 1;
        const crowd = o.crowd === undefined ? 3 : o.crowd;   // ноль это ноль, а не «не задано»
        for (let i = 0; i < crowd; i++) {
            spawnAt(o.kind || 'ходок',
                tip.x + vx / d * (34 + i * 26) + (i % 2 ? 22 : -22),
                tip.y + vy / d * (34 + i * 26) + (o.dy || 0));
        }
        filmT = 130 / 120;
        return this;
    },
    /** Прокрутить сцену на dt секунд, продолжая замах. */
    step(dt) {
        const n = Math.max(1, Math.round((dt || 1 / 60) * 120));
        for (let i = 0; i < n; i++) {
            filmT += 1 / 120;
            aim.x = hero.x + Math.cos(filmT * filmSpin) * filmR;
            aim.y = hero.y + Math.sin(filmT * filmSpin) * filmR;
            physStep(1 / 120);
        }
        return this;
    },
    /** Снять голову ближайшему — только для съёмки эффекта. Частоту
     *  отрыва в бою мерит не это, а таблица `?flow=N`: круговой замах
     *  сцены до порога не разгоняется, рывки бывают только в живом бою. */
    tear() {
        let best = null, bd = 1e9;
        for (const e of foes) {
            if (e.boss || e.dead) continue;
            const d = Math.hypot(e.x - hero.x, e.y - hero.y);
            if (d < bd) { bd = d; best = e; }
        }
        if (!best) return this;
        nums.push({ x: best.x, y: best.y - 16, v: 'башка!', t: 0.8 });
        play('отрыв', 0.6, 1);
        kills++; cntEpic++;
        kill(best, 0, -140, true, true);
        return this;
    },
    render() { draw(); return this; },
    state() {
        return { врагов: foes.length, ошмётков: bits.length, отрывов: cntEpic,
            задник: +biomeFade.toFixed(2), заходят: foes.filter((e) => e.entering).length,
            ворота: Math.round(gate.hp), перелезло: gate.over,
            скорость: Math.round(Math.hypot(...vel(pts[pts.length - 1]))),
            замедление: +slow.toFixed(2), тряска: +shake.toFixed(2) };
    },
};
let filmT = 0, filmSpin = 9, filmR = 92;

/*
 * Проверка прохождения: worm.html?flow прогоняет партию целиком — стартовое
 * окно, выбор оружия, пять волн, смерть, экран итога, «ещё раз». Нужна
 * потому, что экран итога и возврат к выбору иначе никогда не выполняются
 * при проверке: до смерти в отладке не доживают.
 */
if (location.search.includes('flow')) {
    // Один прогон ловит вариант, а не правило: у бота по дороге меняется
    // оружие, и повадки, которые от него зависят, в одном прогоне могут не
    // сработать ни разу. Поэтому прогонов несколько и смотрим разброс.
    const runs = Math.max(1, Math.min(9, parseInt((location.search.match(/flow=(\d+)/) || [])[1], 10) || 3));

    function runOnce(weaponIdx) {
        W = 450; H = 900; sc = 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        showStart();
        const okStart = $('start').classList.contains('on');
        $('start').querySelector('button[data-w="' + weaponIdx + '"]').click();
        const okBegin = started && !menu;

        aim.down = true;
        let k = 0;
        // У партии стало три конца, а прогон знал один. Проверка, написанная
        // под прежнее решение, показывает «не дошёл» там, где партия честно
        // закончилась, и крутит пустоту до упора по времени.
        while (wave < 10 && k < 120 * 1500 && !gateLost && dead <= 0 && !$('over').classList.contains('on')) {
            const t = k++ / 120;
            const cx = ADDR.guard ? WALL + 88 : W / 2;
            const cy = H / 2;
            const rr = ADDR.guard ? 76 : 120;
            aim.x = cx + Math.cos(t * 7) * rr;
            aim.y = cy + Math.sin(t * 7) * rr;
            if (paused) startWave();
            hero.hp = hero.hpMax;             // бессмертие: проверяем прохождение, не бой
            step(1 / 120);
        }
        // Снимаем показания до «ещё раз»: она обнуляет забег.
        const исход = gateLost ? 'ворота' : wave >= 10 ? 'волны' : dead > 0 || $('over').classList.contains('on') ? 'смерть' : 'время';
        const snap = { дошёл: wave >= 10, исход, секунд: Math.round(k / 120), счёт: score, убито: kills,
            поверху: cntOver, схват: cntGrip, взрыв: cntBoom, отрывов: cntEpic,
            переход: Math.round(cntFade / 120), пришло: cntIn,
            ворота: Math.round(gate.hp), перелезло: gate.over, воротаПали: gateLost,
            награды: taken, бочки: blown,
            углы: bodySamples ? Math.round(inCorner / bodySamples * 100) : 0 };
        hero.hp = 0;
        showResult();
        const okOver = $('over').classList.contains('on') && !!$('over').querySelector('button');
        $('over').querySelector('button').click();
        const okAgain = !$('over').classList.contains('on') && $('start').classList.contains('on') && wave === 1;

        return { окно: okStart, начало: okBegin, итог: okOver, ещёраз: okAgain,
            оружие: WEAPONS[weaponIdx][0], ...snap };
    }

    try {
        const all = [];
        for (let i = 0; i < runs; i++) all.push(runOnce(i % WEAPONS.length));

        const pad = (x, n) => String(x).padEnd(n);
        let out = 'ПРОХОЖДЕНИЕ, прогонов ' + runs + '\n' +
            pad('оружие', 11) + pad('исход', 8) + pad('сек', 5) + pad('счёт', 7) +
            pad('убито', 7) + pad('поверху', 9) + pad('схват', 7) + pad('взрыв', 7) +
            pad('отрыв', 7) + pad('перех', 6) + pad('ворота', 7) + pad('перелез', 8) + 'итог+ещёраз\n';
        for (const r of all) {
            out += pad(r.оружие, 11) + pad(r.исход, 8) + pad(r.секунд, 5) +
                pad(r.счёт, 7) + pad(r.убито, 7) + pad(r.поверху, 9) + pad(r.схват, 7) +
                pad(r.взрыв, 7) + pad(r.отрывов, 7) + pad(r.переход + 'с', 6) +
                pad(r.воротаПали ? 'ПАЛИ' : r.ворота, 7) + pad(r.перелезло, 8) +
                ((r.окно && r.начало && r.итог && r.ещёраз) ? 'ок' : 'СЛОМАНО') + '\n';
        }
        const fired = (key) => all.filter((r) => r[key] > 0).length;
        out += '\nсработало прогонов из ' + runs + ': поверху ' + fired('поверху') +
            ', схват ' + fired('схват') + ', взрыв ' + fired('взрыв') +
            '  |  отрывов за партию: ' + all.map((r) => r.отрывов).join(', ') +
            '  |  партия дошла до конца в ' + all.filter((r) => r.дошёл).length;
        console.log(out);
    } catch (err) {
        console.error('ПРОХОЖДЕНИЕ УПАЛО: ' + err.message + ' | ' + (err.stack || '').split('\n')[1]);
    }
}

/* Разбор кривой: worm.html?curve печатает состав и вес каждой волны. */
// Витрина: три петли для показа. Открывается на телефоне и крутится сама,
// физика идёт настоящая — сцену ставит игра, а не запись.
//   ?петля=1 — веер брызг в толпе,   ?петля=2 — дуга и попадание,
//   ?петля=3 — отрыв головы во весь экран.
// Неподвижный кадр для карточки на витрине: сцена ставится, отрыв
// случается, и всё замирает в один и тот же миг. Снимающему не нужно ловить
// момент — кадр повторяется байт в байт.
const stillFrame = ADDR.still;
const loopN = ADDR.loop;
if (loopN >= 1 && loopN <= 3) {
    const N = window.naotmash;
    const setup = () => {
        N.scene(loopN === 1 ? { weapon: 0, crowd: 5, seed: 31, hy: 0.44, radius: 84 }
            : loopN === 2 ? { weapon: 3, crowd: 2, seed: 12, hy: 0.44, radius: 84 }
            : { weapon: 0, crowd: 6, seed: 31, hy: 0.42, radius: 84 });
        return 0;
    };
    let t = setup(), tore = false, prev = 0;
    const frame = (now) => {
        const dt = Math.min(1 / 30, (now - prev) / 1000 || 1 / 60);
        prev = now; t += dt;
        if (loopN === 3 && !tore && t > 0.55) { N.tear(); tore = true; }
        N.step(dt); N.render();
        if (t > (loopN === 3 ? 2.6 : 2.2)) { t = setup(); tore = false; }
        setTimeout(() => frame(performance.now()), 16);
    };
    if (stillFrame) {
        N.step(0.55); N.tear(); N.step(0.42); N.render();   // и больше ничего
    } else {
        // Таймер, а не requestAnimationFrame: витрину надо уметь проверить и
        // в спящей вкладке, где кадры не запрашиваются вовсе.
        setTimeout(() => frame(performance.now()), 16);
    }
}

if (location.search.includes('curve')) {
    srand(12345);
    const pad = (x, n) => String(x).padEnd(n);
    let out = 'КРИВАЯ ВОЛН\n' + pad('волна', 7) + pad('тема', 10) + pad('врагов', 8) + pad('вес HP', 9) + 'состав\n';
    for (let w = 1; w <= 16; w++) {
        const boss = w % 5 === 0;
        const th = pickTheme(w, null);
        const n = boss ? 1 + Math.round(3 + w * 0.6) : Math.min(30, Math.round((4 + w * 1.6) * th[1].size));
        const tally = {};
        let hp = 0;
        for (let i = 0; i < n; i++) {
            const kind = boss && i === 0 ? 'туша' : pickKind(w, th[1].mix);
            tally[kind] = (tally[kind] || 0) + 1;
            hp += Math.round(KINDS[kind].hp * (kind === 'туша' ? 1 + w * 0.9 : 1 + w * 0.16));
        }
        const mix = Object.entries(tally).sort((a, b) => b[1] - a[1])
            .map(([k, c]) => k + ' ' + c).join(', ');
        out += pad(w, 7) + pad(boss ? 'туша' : th[0], 10) + pad(n, 8) + pad(hp, 9) + mix + '\n';
    }
    console.log(out);
}

if (location.search.includes('test')) {
    try {
        // Размер приходит из вёрстки асинхронно, а тест синхронный: задаём сами,
        // иначе бой идёт в арене 0x0 и проверка врёт.
        W = 450; H = 900; sc = 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const wi = parseInt((location.search.match(/[?&]w=(\d+)/) || [])[1], 10);
        if (WEAPONS[wi]) {                       // ?w=N — проверить конкретное оружие
            const w = { ...WEAPONS[wi][2] };
            w.len0 = w.len;
            Object.assign(S, w); Object.assign(BASE, w);
        }
        reset();
        if (location.search.includes('trial')) startTrial();   // сразу показать испытание
        const w0 = parseInt((location.search.match(/[?&]wave=(\d+)/) || [])[1], 10);
        if (w0 > 1) { wave = w0 - 1; foes = []; startWave(); }   // ?wave=N — начать с волны N
        $('start').classList.remove('on');   // чтобы было видно арену
        started = true;
        aim.down = true;
        let peak = 0, ang = 0;
        const R = parseInt((location.search.match(/[?&]r=(\d+)/) || [])[1], 10) || 120;
        const N = parseInt(location.search.split('test=')[1], 10) || 900;
        for (let k = 0; k < N; k++) {
            const t = k / 120;
            // Чередуем быстрый замах и медленное подведение: иначе бот не
            // умеет цеплять, и захват с броском нечем проверить.
            ang += ((Math.floor(t / 2.5) % 2) ? 7 : 0.7) / 120;
            // Радиус тоже гуляет: без движения от себя копьём не уколоть,
            // и проверить его было бы нечем.
            const reach = R * (0.45 + 0.55 * Math.abs(Math.sin(t * 2.3)));
            aim.x = W / 2 + Math.cos(ang) * reach;
            aim.y = H / 2 + Math.sin(ang) * reach;
            if (paused) startWave();          // карточки в тесте пропускаем
            step(1 / 120);
            const q = pts[pts.length - 1];
            peak = Math.max(peak, Math.hypot(q.x - q.px, q.y - q.py) * 120);
        }
        console.log('САМОПРОВЕРКА: волна ' + wave + ', счёт ' + score + ', убито ' + kills + ', схвачено ' + grabs + ', бросков ' + thrown + ', врагов ' + foes.length +
            ', ошмётков ' + bits.length + ', лучший удар ' + Math.round(best) +
            ', кусок в руке: ' + (held ? held.hits : 'нет') +
            ', длина ' + pts.length + ', здоровье ' + hero.hp +
            ', скорость врагов ' + Math.round(foes.length
                ? foes.reduce((a, e) => a + Math.hypot(e.p[1].x - e.p[1].px, e.p[1].y - e.p[1].py) * 120, 0) / foes.length
                : 0) +
            ', пик оружия ' + Math.round(peak) +
            ', рука в ' + Math.round(Math.hypot(pts[0].x - hero.x, pts[0].y - hero.y)) + ' от героя' +
            ', шёл ли герой: ' + (Math.hypot(hero.x - W / 2, hero.y - H / 2) > 5 ? 'да' : 'нет'));
    } catch (err) {
        console.error('САМОПРОВЕРКА УПАЛА: ' + err.message + ' | ' + err.stack);
    }
}
